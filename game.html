<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: transparent;
         user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #wrap { max-width: 680px; margin: 0 auto; }
  #stage { position: relative; width: 100%; border-radius: 12px; overflow: hidden;
           box-shadow: 0 2px 12px rgba(0,0,0,.35); background: #f28c66; touch-action: none; }
  #stage canvas.three { display: block; width: 100%; height: 100%; }

  .big { font-family: Impact, "Arial Black", sans-serif; color: white; letter-spacing: 1px;
         text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }
  #hudR { position: absolute; top: 8px; right: 12px; text-align: right; pointer-events: none; }
  #stars { font-size: 26px; color: #ffd23f; }
  #stars .off { color: rgba(255,255,255,.35); }
  #stars.flash { animation: flash .25s 6 alternate; }
  @keyframes flash { from { transform: scale(1); } to { transform: scale(1.25); color: white; } }
  #score { font-size: 30px; }
  #lives { font-size: 20px; }
  #hudL { position: absolute; top: 8px; left: 12px; pointer-events: none; font-size: 17px; }
  #hudL small { display: block; font-size: 13px; opacity: .9; }

  #radar { position: absolute; left: 10px; bottom: 10px; width: 120px; height: 120px;
           border-radius: 50%; border: 3px solid #111; box-shadow: 0 0 0 2px rgba(255,255,255,.6);
           background: #222; pointer-events: none; }

  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; text-align: center;
             background: linear-gradient(rgba(40,15,60,.75), rgba(200,80,60,.6));
             cursor: pointer; padding: 10px; }
  #oTitle { margin: 0 0 10px; font-size: 40px; }
  #oSub { margin: 0; font-size: 18px; }
  #banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center;
            font-size: 30px; display: none; pointer-events: none; }

  #pad { display: grid; grid-template-columns: 70px 70px 70px; grid-template-rows: 56px 56px;
         gap: 6px; justify-content: center; margin-top: 10px; }
  #pad button { font-size: 26px; border: none; border-radius: 12px; background: #3a2f55;
                color: white; cursor: pointer; }
  #pad button:active { background: #1f1830; }
  #up { grid-column: 2; grid-row: 1; }
  #cam { grid-column: 3; grid-row: 1; font-size: 20px !important; background: #666 !important; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="hudL" class="big"><span id="hChar"></span><small id="hNext"></small><small id="hBest"></small></div>
    <div id="hudR" class="big"><div id="stars"></div><div id="score">💩 0</div><div id="lives"></div></div>
    <canvas id="radar" width="240" height="240"></canvas>
    <div id="banner" class="big"></div>
    <div id="overlay"><h2 id="oTitle" class="big">💩 POOP RUN: CITY</h2><p id="oSub" class="big">Loading the city...</p></div>
  </div>
  <div id="pad">
    <button id="up">⬆️</button>
    <button id="cam" title="Switch camera">🎥</button>
    <button id="left">⬅️</button>
    <button id="down">⬇️</button>
    <button id="right">➡️</button>
  </div>
</div>

<script>
  // If the 3D library can't load (no internet / blocked), say so instead of a blank screen
  setTimeout(() => {
    if (!window.gameReady) {
      document.getElementById("oSub").textContent =
        "Couldn't load the 3D library. Check your internet connection and refresh.";
    }
  }, 10000);
</script>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const CFG = __CONFIG__;
const MAP = CFG.map;
const ROWS = MAP.length, COLS = MAP[0].length;

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const POLICE_SPAWNS = [[26, 16], [26, 1], [1, 16], [16, 11], [11, 16]];
const PLAYER_START = [1, 1];
const H_ROADS = [1, 6, 11, 16];          // rows that are full streets
const V_ROADS = [1, 6, 11, 16, 21, 26];  // columns that are full streets

const inside = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const tile = (x, y) => (inside(x, y) ? MAP[y][x] : "#");
const isWall = (x, y) => !(tile(x, y) === "." || tile(x, y) === "g"); // people & police
const isRoad = (x, y) => tile(x, y) === ".";                         // traffic cars
const EMPTY = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!isWall(x, y)) EMPTY.push([x, y]);

const wx = x => x - COLS / 2 + 0.5;  // tile x -> world x
const wz = y => y - ROWS / 2 + 0.5;  // tile y -> world z

// Random numbers that are the same every time (so the city always looks the same)
function seeded(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const cityRand = seeded(CFG.seed);

function loadBest() { try { return Number(localStorage.getItem("poopRunCityBest")) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem("poopRunCityBest", String(v)); } catch (e) {} }
let best = loadBest();

// =========================================================
//  3D SCENE: sunset sky, lights
// =========================================================
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.domElement.className = "three";
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
function skyTexture() {
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#2b1b4e");
  grad.addColorStop(0.45, "#b8457a");
  grad.addColorStop(0.75, "#ff8f5a");
  grad.addColorStop(1, "#ffd08a");
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = skyTexture();
scene.fog = new THREE.Fog("#e88a6a", 16, 38);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 120);
let cameraMode = "follow";

function resize() {
  const w = stage.clientWidth;
  const h = Math.round(w * 0.7);
  stage.style.height = h + "px";
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

scene.add(new THREE.HemisphereLight("#ffd1a8", "#3a2a4a", 0.9));
const sun = new THREE.DirectionalLight("#ffb070", 2.2);
sun.position.set(-12, 9, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 12, bottom: -12, near: 1, far: 50 });
scene.add(sun);

// =========================================================
//  THE CITY: ground, buildings, trees
// =========================================================
function groundTexture() {
  const P = 32;
  const c = document.createElement("canvas");
  c.width = COLS * P; c.height = ROWS * P;
  const g = c.getContext("2d");
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const ch = MAP[y][x], X = x * P, Y = y * P;
    if (ch === ".") {
      g.fillStyle = "#3b3b42"; g.fillRect(X, Y, P, P);
      const L = isRoad(x - 1, y), R = isRoad(x + 1, y), U = isRoad(x, y - 1), D = isRoad(x, y + 1);
      g.fillStyle = "#f2c94c";
      if ((L || R) && !U && !D) { g.fillRect(X + 3, Y + P / 2 - 1, 10, 2); g.fillRect(X + 19, Y + P / 2 - 1, 10, 2); }
      if ((U || D) && !L && !R) { g.fillRect(X + P / 2 - 1, Y + 3, 2, 10); g.fillRect(X + P / 2 - 1, Y + 19, 2, 10); }
      // curbs where the road meets the sidewalk
      g.fillStyle = "#9a958c";
      if (isWall(x - 1, y)) g.fillRect(X, Y, 2, P);
      if (isWall(x + 1, y)) g.fillRect(X + P - 2, Y, 2, P);
      if (isWall(x, y - 1)) g.fillRect(X, Y, P, 2);
      if (isWall(x, y + 1)) g.fillRect(X, Y + P - 2, P, 2);
    } else if (ch === "g" || ch === "T") {
      g.fillStyle = "#5fae45"; g.fillRect(X, Y, P, P);
      g.fillStyle = "#4f9a3a";
      for (let i = 0; i < 6; i++) g.fillRect(X + cityRand() * 30, Y + cityRand() * 30, 2, 2);
    } else {
      g.fillStyle = "#b8b0a4"; g.fillRect(X, Y, P, P);
      g.fillStyle = "#a39b8f";
      g.fillRect(X + 15, Y, 1, P); g.fillRect(X, Y + 15, P, 1);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(COLS, ROWS),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const outskirts = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: "#8a7f72" })
);
outskirts.rotation.x = -Math.PI / 2;
outskirts.position.y = -0.02;
scene.add(outskirts);

// Window textures: "map" is the wall with dark windows, "glow" lights some windows up
function windowTextures(variant) {
  const make = () => { const c = document.createElement("canvas"); c.width = c.height = 64; return c; };
  const wall = make(), glow = make();
  const a = wall.getContext("2d"), b = glow.getContext("2d");
  a.fillStyle = "#ffffff"; a.fillRect(0, 0, 64, 64);
  b.fillStyle = "#000000"; b.fillRect(0, 0, 64, 64);
  const r = seeded(100 + variant);
  for (const wx0 of [10, 36]) {
    a.fillStyle = "#2a3550"; a.fillRect(wx0, 14, 18, 30);
    if (r() < 0.45) { b.fillStyle = "#ffd27a"; b.fillRect(wx0, 14, 18, 30); }
  }
  const tex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
                     t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };
  return { map: tex(wall), glow: tex(glow) };
}
const WINDOW_SETS = [0, 1, 2, 3].map(windowTextures);
const PALETTE = ["#d9a066", "#c76b5a", "#e8d3a9", "#8fa3b8", "#b07aa1", "#6c8f8a", "#e0b85a", "#a8a29e", "#7d8fc9"];
const roofMat = new THREE.MeshStandardMaterial({ color: "#5d5a63", roughness: 0.9 });
const FLOOR_H = 0.7;

// Find each building (connected "#" squares) so it gets one colour and height
const buildingId = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
const buildingInfo = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  if (MAP[y][x] !== "#" || buildingId[y][x] >= 0) continue;
  const id = buildingInfo.length, stack = [[x, y]];
  buildingId[y][x] = id;
  let border = false;
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx === 0 || cy === 0 || cx === COLS - 1 || cy === ROWS - 1) border = true;
    for (const [dx, dy] of Object.values(DIRS)) {
      const nx = cx + dx, ny = cy + dy;
      if (tile(nx, ny) === "#" && inside(nx, ny) && buildingId[ny][nx] < 0) { buildingId[ny][nx] = id; stack.push([nx, ny]); }
    }
  }
  const floors = border ? 6 : (cityRand() < 0.15 ? 7 : 1 + Math.floor(cityRand() * 4));
  const set = WINDOW_SETS[Math.floor(cityRand() * WINDOW_SETS.length)];
  const map = set.map.clone(), glow = set.glow.clone();
  map.repeat.set(1, floors); glow.repeat.set(1, floors);
  map.needsUpdate = glow.needsUpdate = true;
  const side = new THREE.MeshStandardMaterial({
    color: PALETTE[Math.floor(cityRand() * PALETTE.length)], map, roughness: 0.8,
    emissive: "#ffcf7a", emissiveMap: glow, emissiveIntensity: 0.7,
  });
  buildingInfo.push({ floors, mats: [side, side, roofMat, roofMat, side, side] });
}

const boxGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
const BUILDINGS = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  const id = buildingId[y][x];
  if (id < 0) continue;
  const same = (nx, ny) => inside(nx, ny) && buildingId[ny][nx] === id;
  const GAP = 0.12;
  const x0 = same(x - 1, y) ? 0 : GAP, x1 = same(x + 1, y) ? 1 : 1 - GAP;
  const z0 = same(x, y - 1) ? 0 : GAP, z1 = same(x, y + 1) ? 1 : 1 - GAP;
  const info = buildingInfo[id];
  const h = info.floors * FLOOR_H;
  const mesh = new THREE.Mesh(boxGeo, info.mats);
  mesh.position.set(wx(x) - 0.5 + (x0 + x1) / 2, 0, wz(y) - 0.5 + (z0 + z1) / 2);
  mesh.scale.set(x1 - x0, h, z1 - z0);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  BUILDINGS.push({ mesh, x, y, h, k: 1 });
}

// Palm trees and park trees
const trunkMat = new THREE.MeshStandardMaterial({ color: "#8b5a2b", roughness: 0.9 });
const leafMat = new THREE.MeshStandardMaterial({ color: "#2f8f3a", roughness: 0.7, side: THREE.DoubleSide });
function makePalm() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 1.7, 6), trunkMat);
  trunk.position.y = 0.85; trunk.castShadow = true;
  g.add(trunk);
  const leafGeo = new THREE.BoxGeometry(0.65, 0.02, 0.16).translate(0.32, 0, 0);
  for (let i = 0; i < 7; i++) {
    const pivot = new THREE.Group();
    pivot.position.y = 1.7;
    pivot.rotation.y = (i / 7) * Math.PI * 2;
    const leaf = new THREE.Mesh(leafGeo, leafMat);
    leaf.rotation.z = -0.45;
    leaf.castShadow = true;
    pivot.add(leaf);
    g.add(pivot);
  }
  return g;
}
function makeTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.6, 6), trunkMat);
  trunk.position.y = 0.3; trunk.castShadow = true;
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10),
                             new THREE.MeshStandardMaterial({ color: "#3f9a3a", roughness: 0.8 }));
  top.position.y = 0.85; top.castShadow = true;
  g.add(trunk, top);
  return g;
}
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  const ch = MAP[y][x];
  if (ch !== "P" && ch !== "T") continue;
  const t = ch === "P" ? makePalm() : makeTree();
  t.position.set(wx(x), 0, wz(y));
  t.rotation.y = cityRand() * Math.PI * 2;
  scene.add(t);
}

// =========================================================
//  CHARACTERS, CARS AND POOP
// =========================================================
function emojiSprite(emoji, scale) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.font = "100px serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(emoji, 64, 72);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false }));
  s.scale.set(scale, scale, 1);
  return s;
}

function nameTag(text) {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(0,0,0,.65)";
  g.beginPath(); g.roundRect(8, 8, 240, 48, 20); g.fill();
  g.fillStyle = "white"; g.font = "bold 30px system-ui";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 128, 33);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, fog: false }));
  s.scale.set(1.2, 0.3, 1);
  s.renderOrder = 10;
  return s;
}

function makeCharacter(ch) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.22, 0.3, 6, 16),
    new THREE.MeshStandardMaterial({ color: ch.color, roughness: 0.5 })
  );
  body.position.y = 0.42;
  body.castShadow = true;
  g.add(body);
  const face = emojiSprite(ch.face, 0.55);
  face.position.y = 0.95;
  g.add(face);
  const tag = nameTag(ch.name);
  tag.position.y = 1.42;
  g.add(tag);
  // glowing ring under the player so you can always spot yourself
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.4, 24),
                              new THREE.MeshBasicMaterial({ color: "#7cf9ff", transparent: true, opacity: 0.8 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
  g.add(ring);
  g.userData.body = body;
  return g;
}

const wheelGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.07, 10).rotateZ(Math.PI / 2);
const wheelMat = new THREE.MeshStandardMaterial({ color: "#111" });
const glassMat = new THREE.MeshStandardMaterial({ color: "#1f2a3a", roughness: 0.2, metalness: 0.5 });
const lampMat = new THREE.MeshStandardMaterial({ color: "#fff6c0", emissive: "#fff2a0", emissiveIntensity: 1 });
function makeCar(color, police) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: police ? "#f5f5f5" : color, roughness: 0.35, metalness: 0.3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.86), bodyMat);
  body.position.y = 0.19; body.castShadow = true;
  g.add(body);
  if (police) {
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.51, 0.08, 0.5),
                                  new THREE.MeshStandardMaterial({ color: "#111" }));
    stripe.position.y = 0.19;
    g.add(stripe);
  }
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.17, 0.44), glassMat);
  cabin.position.set(0, 0.37, -0.05); cabin.castShadow = true;
  g.add(cabin);
  for (const [x, z] of [[-0.26, 0.28], [0.26, 0.28], [-0.26, -0.28], [0.26, -0.28]]) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.position.set(x, 0.09, z);
    g.add(w);
  }
  for (const x of [-0.16, 0.16]) {
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, 0.02), lampMat);
    lamp.position.set(x, 0.21, 0.435);
    g.add(lamp);
  }
  if (police) {
    const red = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.07, 0.1), new THREE.MeshBasicMaterial({ color: "#ff2030" }));
    const blue = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.07, 0.1), new THREE.MeshBasicMaterial({ color: "#2050ff" }));
    red.position.set(-0.09, 0.49, -0.05); blue.position.set(0.09, 0.49, -0.05);
    g.add(red, blue);
    g.userData.lights = [red, blue];
  }
  return g;
}
const CAR_COLORS = ["#e63946", "#2a9d8f", "#f4a261", "#457b9d", "#ffd23f", "#8338ec", "#06d6a0", "#ef476f"];

const poopMat = new THREE.MeshStandardMaterial({ color: "#6b3e1f", roughness: 0.6 });
const goldMat = new THREE.MeshStandardMaterial({ color: "#ffd23f", roughness: 0.25, metalness: 0.8,
                                                 emissive: "#a07000", emissiveIntensity: 0.5 });
const poopGeos = [
  new THREE.TorusGeometry(0.18, 0.09, 10, 20),
  new THREE.TorusGeometry(0.125, 0.077, 10, 20),
  new THREE.TorusGeometry(0.07, 0.063, 10, 20),
];
const tipGeo = new THREE.ConeGeometry(0.063, 0.13, 12);
const eyeGeo = new THREE.SphereGeometry(0.04, 8, 8), pupilGeo = new THREE.SphereGeometry(0.02, 8, 8);
const eyeMat = new THREE.MeshBasicMaterial({ color: "white" }), pupilMat = new THREE.MeshBasicMaterial({ color: "black" });
function makePoop(golden) {
  const g = new THREE.Group();
  const mat = golden ? goldMat : poopMat;
  poopGeos.forEach((geo, i) => {
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.09 + i * 0.125;
    ring.castShadow = true;
    g.add(ring);
  });
  const tip = new THREE.Mesh(tipGeo, mat);
  tip.position.y = 0.45;
  g.add(tip);
  [-0.07, 0.07].forEach(x => {
    const eye = new THREE.Mesh(eyeGeo, eyeMat); eye.position.set(x, 0.23, 0.18);
    const pupil = new THREE.Mesh(pupilGeo, pupilMat); pupil.position.set(x, 0.23, 0.215);
    g.add(eye, pupil);
  });
  if (golden) g.scale.setScalar(1.25);
  return g;
}

// =========================================================
//  GAME LOGIC
// =========================================================
let S;
const rand = Math.random;

function characterIndex(eaten) {
  let idx = 0;
  CFG.characters.forEach((c, i) => { if (eaten >= c.needs) idx = i; });
  return idx;
}
function wantedStars() { return Math.min(CFG.max_stars, 1 + Math.floor(S.eaten / CFG.poop_per_star)); }
function policeSpeed() { return Math.max(120, CFG.police_speed_ms - (wantedStars() - 1) * CFG.police_speed_step); }

// Every moving thing slides smoothly from (fx, fy) to (x, y)
function placeAt(e, x, y) { e.x = e.fx = x; e.y = e.fy = y; e.t0 = 0; e.dur = 1; }
function moveTo(e, x, y, now, dur) {
  e.ang = Math.atan2(x - e.x, y - e.y);
  e.fx = e.x; e.fy = e.y; e.x = x; e.y = y; e.t0 = now; e.dur = dur;
}
function renderPos(e, now) {
  const k = Math.min(1, (now - e.t0) / e.dur);
  return [e.fx + (e.x - e.fx) * k, e.fy + (e.y - e.fy) * k, k];
}
function turnToward(mesh, target) {
  let d = target - mesh.rotation.y;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  mesh.rotation.y += d * 0.25;
}
const dist2 = (a, x, y) => Math.abs(a.x - x) + Math.abs(a.y - y);

function setPlayerModel() {
  if (S.player.mesh) scene.remove(S.player.mesh);
  S.player.mesh = makeCharacter(CFG.characters[S.charIdx]);
  scene.add(S.player.mesh);
}

function newGame() {
  if (S) [...S.police, ...S.poops, ...S.cars].forEach(e => scene.remove(e.mesh));
  S = {
    player: { dir: null, next: null, ang: 0, mesh: S ? S.player.mesh : null },
    police: [], poops: [], cars: [], eaten: 0, lives: CFG.lives, stars: 1,
    started: false, over: false, msgUntil: 0, safeUntil: 0, popUntil: 0,
    lastPlayer: 0, lastPolice: 0, lastCars: 0, charIdx: 0,
  };
  placeAt(S.player, PLAYER_START[0], PLAYER_START[1]);
  setPlayerModel();
  addPolice();
  addTraffic();
  fillPoop();
  updateHud();
}

function addPolice() {
  while (S.police.length < wantedStars()) {
    const s = POLICE_SPAWNS[S.police.length % POLICE_SPAWNS.length];
    const cop = { sx: s[0], sy: s[1], ang: 0, mesh: makeCar(null, true) };
    placeAt(cop, s[0], s[1]);
    scene.add(cop.mesh);
    S.police.push(cop);
  }
}

function addTraffic() {
  let tries = 0;
  while (S.cars.length < CFG.traffic_cars && tries++ < 300) {
    const horiz = rand() < 0.5;
    const line = horiz ? H_ROADS[Math.floor(rand() * H_ROADS.length)] : V_ROADS[Math.floor(rand() * V_ROADS.length)];
    const pos = 1 + Math.floor(rand() * ((horiz ? COLS : ROWS) - 2));
    const x = horiz ? pos : line, y = horiz ? line : pos;
    if (!isRoad(x, y) || dist2(S.player, x, y) < 6 || S.cars.some(c => c.x === x && c.y === y)) continue;
    const d = rand() < 0.5 ? 1 : -1;
    const car = { dx: horiz ? d : 0, dy: horiz ? 0 : d, mesh: makeCar(CAR_COLORS[S.cars.length % CAR_COLORS.length], false) };
    placeAt(car, x, y);
    car.ang = Math.atan2(car.dx, car.dy);
    car.mesh.rotation.y = car.ang;
    scene.add(car.mesh);
    S.cars.push(car);
  }
}

function fillPoop() {
  let tries = 0;
  while (S.poops.length < CFG.poop_on_map && tries++ < 500) {
    const [x, y] = EMPTY[Math.floor(rand() * EMPTY.length)];
    if (dist2(S.player, x, y) <= 4 || S.poops.some(p => p.x === x && p.y === y)) continue;
    const golden = rand() < CFG.golden_chance;
    const mesh = makePoop(golden);
    mesh.position.set(wx(x), 0, wz(y));
    mesh.rotation.y = rand() * Math.PI * 2;
    scene.add(mesh);
    S.poops.push({ x, y, mesh, value: golden ? 3 : 1, golden });
  }
}

const bannerEl = document.getElementById("banner");
function showMsg(text, now, ms = 1600) {
  bannerEl.textContent = text;
  bannerEl.style.display = "block";
  S.msgUntil = now + ms;
}

// ---------- Player ----------
function stepPlayer(now) {
  const p = S.player;
  if (p.next) {
    const [dx, dy] = DIRS[p.next];
    if (!isWall(p.x + dx, p.y + dy)) p.dir = p.next;
  }
  if (!p.dir) return;
  const [dx, dy] = DIRS[p.dir];
  if (isWall(p.x + dx, p.y + dy)) return;
  moveTo(p, p.x + dx, p.y + dy, now, CFG.characters[S.charIdx].speed_ms);

  const i = S.poops.findIndex(q => q.x === p.x && q.y === p.y);
  if (i >= 0) {
    const poop = S.poops[i];
    scene.remove(poop.mesh);
    S.poops.splice(i, 1);
    S.eaten += poop.value;
    const oldStars = S.stars;
    S.stars = wantedStars();
    const newIdx = characterIndex(S.eaten);
    if (newIdx > S.charIdx) {
      S.charIdx = newIdx;
      setPlayerModel();
      S.popUntil = now + 600;
      showMsg("UPGRADE! YOU ARE NOW " + CFG.characters[newIdx].name.toUpperCase(), now, 2300);
    } else if (S.stars > oldStars) {
      showMsg("WANTED LEVEL " + S.stars + " ⭐", now);
    } else if (poop.golden) {
      showMsg("GOLDEN POOP! +3", now, 1000);
    }
    if (S.stars > oldStars) flashStars();
    addPolice();
    fillPoop();
    updateHud();
  }
  checkHit(now);
}

// ---------- Police AI (breadth-first search) ----------
// Works out how many steps every square is from the player.
function distanceMap() {
  const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
  const queue = [[S.player.x, S.player.y]];
  dist[S.player.y][S.player.x] = 0;
  for (let qi = 0; qi < queue.length; qi++) {
    const [x, y] = queue[qi];
    for (const [dx, dy] of Object.values(DIRS)) {
      const nx = x + dx, ny = y + dy;
      if (!isWall(nx, ny) && dist[ny][nx] === Infinity) {
        dist[ny][nx] = dist[y][x] + 1;
        queue.push([nx, ny]);
      }
    }
  }
  return dist;
}

function stepPolice(now) {
  const dist = distanceMap(), speed = policeSpeed();
  S.police.forEach((cop, i) => {
    const options = Object.values(DIRS)
      .map(([dx, dy]) => [cop.x + dx, cop.y + dy])
      .filter(([x, y]) => !isWall(x, y) && !S.police.some(o => o !== cop && o.x === x && o.y === y));
    if (!options.length) return;
    let choice;
    if (i > 0 && rand() < CFG.police_randomness) {
      choice = options[Math.floor(rand() * options.length)];
    } else {
      choice = options.reduce((a, b) => (dist[b[1]][b[0]] < dist[a[1]][a[0]] ? b : a));
    }
    moveTo(cop, choice[0], choice[1], now, speed);
  });
  checkHit(now);
}

// ---------- Traffic: drive straight, sometimes turn at crossroads ----------
function stepCars(now) {
  S.cars.forEach(car => {
    // at a crossroads, maybe turn left or right
    const sides = [[car.dy, car.dx], [-car.dy, -car.dx]].filter(([dx, dy]) => isRoad(car.x + dx, car.y + dy));
    if (sides.length && rand() < 0.3) [car.dx, car.dy] = sides[Math.floor(rand() * sides.length)];
    let nx = car.x + car.dx, ny = car.y + car.dy;
    const blocked = (x, y) => !isRoad(x, y) || S.cars.some(o => o !== car && o.x === x && o.y === y);
    if (blocked(nx, ny)) {
      if (sides.length) [car.dx, car.dy] = sides[0];
      else { car.dx = -car.dx; car.dy = -car.dy; }
      nx = car.x + car.dx; ny = car.y + car.dy;
      if (blocked(nx, ny)) return;
    }
    moveTo(car, nx, ny, now, CFG.car_speed_ms);
  });
  checkHit(now);
}

function checkHit(now) {
  if (now < S.safeUntil || S.over) return;
  const at = e => e.x === S.player.x && e.y === S.player.y;
  let reason = null;
  if (S.police.some(at)) reason = "BUSTED BY THE POLICE 🚓";
  else if (S.cars.some(at)) reason = "RUN OVER! 🚗";
  if (!reason) return;
  S.lives--;
  updateHud();
  if (S.lives <= 0) {
    S.over = true;
    if (S.eaten > best) { best = S.eaten; saveBest(best); updateHud(); }
    showOverlay("GAME OVER", reason + "<br>You ate " + S.eaten + " 💩 &nbsp;·&nbsp; Best: " + best +
                "<br><br>Tap or press Space to play again");
    return;
  }
  placeAt(S.player, PLAYER_START[0], PLAYER_START[1]);
  S.player.dir = null; S.player.next = null;
  S.police.forEach(c => placeAt(c, c.sx, c.sy));
  S.safeUntil = now + 2000;
  showMsg(reason, now, 1800);
}

// ---------- HUD, radar and overlay ----------
const overlayEl = document.getElementById("overlay");
function showOverlay(title, subHtml) {
  document.getElementById("oTitle").textContent = title;
  document.getElementById("oSub").innerHTML = subHtml;
  overlayEl.style.display = "flex";
}

const starsEl = document.getElementById("stars");
function flashStars() {
  starsEl.classList.remove("flash"); void starsEl.offsetWidth; starsEl.classList.add("flash");
}
function updateHud() {
  const ch = CFG.characters[S.charIdx];
  document.getElementById("hChar").textContent = ch.face + " " + ch.name.toUpperCase();
  const nextC = CFG.characters[S.charIdx + 1];
  document.getElementById("hNext").textContent =
    nextC ? "Next: " + nextC.name + " in " + (nextC.needs - S.eaten) + " 💩" : "MAX LEVEL!";
  document.getElementById("hBest").textContent = "Best: " + best;
  document.getElementById("score").textContent = "💩 " + S.eaten;
  document.getElementById("lives").textContent = "❤️".repeat(Math.max(0, S.lives));
  let stars = "";
  for (let i = 1; i <= CFG.max_stars; i++) stars += i <= S.stars ? "★" : '<span class="off">★</span>';
  starsEl.innerHTML = stars;
}

const RT = 10; // radar pixels per map square
const radarMap = document.createElement("canvas");
radarMap.width = COLS * RT; radarMap.height = ROWS * RT;
{
  const g = radarMap.getContext("2d");
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const ch = MAP[y][x];
    g.fillStyle = ch === "." ? "#9a9a9a" : ch === "g" || ch === "T" ? "#4f9a3a" : "#3a3a40";
    g.fillRect(x * RT, y * RT, RT, RT);
  }
}
const radar = document.getElementById("radar").getContext("2d");
function drawRadar(px, py, now) {
  const W = 240, cx = W / 2, cy = W / 2, s = 2; // canvas is 2x its CSS size
  radar.fillStyle = "#222"; radar.fillRect(0, 0, W, W);
  radar.save();
  radar.translate(cx, cy);
  radar.scale(s, s);
  radar.drawImage(radarMap, -(px + 0.5) * RT, -(py + 0.5) * RT);
  const dot = (e, color, r) => {
    radar.fillStyle = color;
    radar.beginPath(); radar.arc((e.x - px) * RT, (e.y - py) * RT, r, 0, Math.PI * 2); radar.fill();
  };
  S.poops.forEach(p => dot(p, p.golden ? "#ffd23f" : "#a0622d", 3));
  S.cars.forEach(c => dot(c, "#dddddd", 2.5));
  S.police.forEach((c, i) => dot(c, Math.floor(now / 250 + i) % 2 ? "#ff2030" : "#3070ff", 4));
  // player arrow
  const d = DIRS[S.player.dir || "up"];
  radar.rotate(Math.atan2(d[0], -d[1]));
  radar.fillStyle = "white"; radar.strokeStyle = "black"; radar.lineWidth = 1;
  radar.beginPath(); radar.moveTo(0, -6); radar.lineTo(4.5, 5); radar.lineTo(0, 2.5); radar.lineTo(-4.5, 5);
  radar.closePath(); radar.fill(); radar.stroke();
  radar.restore();
}

// =========================================================
//  GAME LOOP
// =========================================================
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3(0, 22, 13);
const camGoal = new THREE.Vector3();

function loop(now) {
  if (S.started && !S.over) {
    if (now - S.lastPlayer >= CFG.characters[S.charIdx].speed_ms) { S.lastPlayer = now; stepPlayer(now); }
    if (now - S.lastPolice >= policeSpeed()) { S.lastPolice = now; stepPolice(now); }
    if (now - S.lastCars >= CFG.car_speed_ms) { S.lastCars = now; stepCars(now); }
  }
  if (now > S.msgUntil) bannerEl.style.display = "none";

  // Player
  const [px, py, pk] = renderPos(S.player, now);
  const pm = S.player.mesh;
  pm.position.set(wx(px), 0, wz(py));
  pm.userData.body.position.y = 0.42 + (pk < 1 ? Math.abs(Math.sin(now / 70)) * 0.08 : 0);
  pm.visible = !(now < S.safeUntil && Math.floor(now / 120) % 2 === 0);
  pm.scale.setScalar(now < S.popUntil ? 1 + Math.sin(((S.popUntil - now) / 600) * Math.PI) * 0.5 : 1);

  // Police cars and traffic
  for (const car of [...S.police, ...S.cars]) {
    const [cx, cy] = renderPos(car, now);
    car.mesh.position.set(wx(cx), 0, wz(cy));
    turnToward(car.mesh, car.ang);
  }
  S.police.forEach((cop, i) => {
    const on = Math.floor(now / 200 + i) % 2;
    cop.mesh.userData.lights[0].material.color.set(on ? "#ff2030" : "#400008");
    cop.mesh.userData.lights[1].material.color.set(on ? "#08103a" : "#2050ff");
  });

  // Poop spins and bobs
  S.poops.forEach((p, i) => {
    p.mesh.rotation.y += p.golden ? 0.05 : 0.02;
    p.mesh.position.y = Math.sin(now / 300 + i) * 0.05 + 0.03;
  });

  // Buildings between the camera and the player shrink so you can see yourself
  const follow = cameraMode === "follow";
  for (const b of BUILDINGS) {
    const hide = follow && b.y > py && b.y <= py + 4 && Math.abs(b.x - px) <= 1.6;
    const target = hide ? Math.min(1, 0.35 / b.h) : 1;
    if (Math.abs(b.k - target) > 0.001) {
      b.k += (target - b.k) * 0.15;
      b.mesh.scale.y = b.h * b.k;
    }
  }

  // Camera
  if (follow) {
    camTarget.set(wx(px), 0, wz(py) - 0.5);
    camGoal.set(wx(px), 7.5, wz(py) + 5.8);
  } else {
    camTarget.set(0, 0, 0.5);
    camGoal.set(0, 22, 13);
  }
  camPos.lerp(camGoal, 0.08);
  camera.position.copy(camPos);
  camera.lookAt(camTarget);

  drawRadar(px, py, now);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// =========================================================
//  CONTROLS
// =========================================================
function press(dir) {
  if (S.over) newGame();
  if (!S.started) {
    S.started = true;
    S.safeUntil = performance.now() + 1500;
    overlayEl.style.display = "none";
  }
  if (dir) S.player.next = dir;
}

const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
               w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
document.addEventListener("keydown", e => {
  if (KEYS[e.key]) { e.preventDefault(); press(KEYS[e.key]); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); press(null); }
  else if (e.key === "c" || e.key === "C") toggleCamera();
});

["up", "down", "left", "right"].forEach(d => {
  document.getElementById(d).addEventListener("pointerdown", e => { e.preventDefault(); press(d); });
});

function toggleCamera() { cameraMode = cameraMode === "follow" ? "overview" : "follow"; }
document.getElementById("cam").addEventListener("pointerdown", e => { e.preventDefault(); toggleCamera(); });

let touchStart = null;
stage.addEventListener("touchstart", e => { touchStart = e.touches[0]; e.preventDefault(); }, { passive: false });
stage.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.clientX, dy = t.clientY - touchStart.clientY;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { press(null); return; }
  press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
}, { passive: false });
stage.addEventListener("mousedown", () => press(null));

newGame();
window.gameReady = true;
showOverlay("💩 POOP RUN: CITY", "Eat poop. Dodge traffic. Escape the police.<br><br>Tap or press any arrow to start");
requestAnimationFrame(loop);
</script>
