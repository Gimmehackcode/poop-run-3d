<style>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const CFG = __CONFIG__;
const MAP = CFG.map;
const ROWS = MAP.length, COLS = MAP[0].length;
const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];

const inside = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const tile = (x, y) => (inside(x, y) ? MAP[y][x] : "#");
const WALKABLE = ".gspkd";
const isWall = (x, y) => !WALKABLE.includes(tile(x, y));   // squares people can't path through
const isRoad = (x, y) => tile(x, y) === ".";              // squares traffic drives on
const isB = (x, y) => inside(x, y) && MAP[y][x] === "#";

const H_ROADS = [], V_ROADS = [];
for (let y = 0; y < ROWS; y++) { let n = 0; for (let x = 0; x < COLS; x++) n += isRoad(x, y); if (n > COLS * 0.7) H_ROADS.push(y); }
for (let x = 0; x < COLS; x++) { let n = 0; for (let y = 0; y < ROWS; y++) n += isRoad(x, y); if (n > ROWS * 0.5) V_ROADS.push(x); }
const CROSSROADS = [];
for (const y of H_ROADS) for (const x of V_ROADS) if (isRoad(x, y)) CROSSROADS.push([x, y]);
// ---------- Junctions and traffic lights ----------
// a real crossroads has a street going through it both ways (the two lanes of an avenue don't count)
function isCross(x, y) {
  if (!isRoad(x, y)) return false;
  const L = isRoad(x - 1, y), R = isRoad(x + 1, y), U = isRoad(x, y - 1), D = isRoad(x, y + 1);
  const across = (L && R) || (L && isRoad(x - 2, y)) || (R && isRoad(x + 2, y));
  const along = (U && D) || (U && isRoad(x, y - 2)) || (D && isRoad(x, y + 2));
  return across && along;
}
const JUNC = Array.from({ length: ROWS }, () => Array(COLS).fill(null));   // which junction each square belongs to
const JUNCTIONS = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  if (!isCross(x, y) || JUNC[y][x]) continue;
  const J = { tiles: [], x0: x, x1: x, y0: y, y1: y, sides: [] };
  const todo = [[x, y]]; JUNC[y][x] = J;
  while (todo.length) {
    const [a, b] = todo.pop(); J.tiles.push([a, b]);
    J.x0 = Math.min(J.x0, a); J.x1 = Math.max(J.x1, a); J.y0 = Math.min(J.y0, b); J.y1 = Math.max(J.y1, b);
    for (const [dx, dy] of DIRS) { const nx = a + dx, ny = b + dy; if (isCross(nx, ny) && !JUNC[ny][nx]) { JUNC[ny][nx] = J; todo.push([nx, ny]); } }
  }
  // which sides have a road coming in (W, E, N, S)
  const anyRoad = list => list.some(([a, b]) => isRoad(a, b));
  const rows = [], cols = [];
  for (let yy = J.y0; yy <= J.y1; yy++) rows.push(yy);
  for (let xx = J.x0; xx <= J.x1; xx++) cols.push(xx);
  if (anyRoad(rows.map(yy => [J.x0 - 1, yy]))) J.sides.push([1, 0]);    // cars coming from the west drive east
  if (anyRoad(rows.map(yy => [J.x1 + 1, yy]))) J.sides.push([-1, 0]);
  if (anyRoad(cols.map(xx => [xx, J.y0 - 1]))) J.sides.push([0, 1]);
  if (anyRoad(cols.map(xx => [xx, J.y1 + 1]))) J.sides.push([0, -1]);
  J.lights = J.sides.length >= 3;   // a bend in the road doesn't need traffic lights
  JUNCTIONS.push(J);
}
// Junctions only 1 square apart share one set of lights, so you never have to stop in the middle of one
const CTRLS = [];
for (const J of JUNCTIONS) {
  if (!J.lights) continue;
  const near = CTRLS.find(c => c.js.some(K => {
    const gx = Math.max(0, Math.max(J.x0, K.x0) - Math.min(J.x1, K.x1) - 1), gy = Math.max(0, Math.max(J.y0, K.y0) - Math.min(J.y1, K.y1) - 1);
    return (gx <= 1 && gy === 0 && J.y0 <= K.y1 && K.y0 <= J.y1) || (gy <= 1 && gx === 0 && J.x0 <= K.x1 && K.x0 <= J.x1);
  }));
  if (near) { near.js.push(J); J.ctrl = near; } else { const c = { js: [J], group: CTRLS.length % 3 }; CTRLS.push(c); J.ctrl = c; }
}
const isJ = (x, y) => inside(x, y) && JUNC[y][x] !== null;

// Light timings in seconds. One side gets green, then yellow, then everyone gets red for a moment, then the other side.
const LIGHT_GREEN = 6.5, LIGHT_YELLOW = 2, LIGHT_ALLRED = 1.3;
const LIGHT_CYCLE = 2 * (LIGHT_GREEN + LIGHT_YELLOW + LIGHT_ALLRED);
let trafficClock = 0;
// axis 0 = cars driving east-west, axis 1 = cars driving north-south. Returns "g", "y" or "r".
function lightFor(J, axis) {
  if (!J || !J.lights) return "g";
  let u = (trafficClock + J.ctrl.group * LIGHT_CYCLE / 3) % LIGHT_CYCLE;
  if (axis === 1) u = (u + LIGHT_CYCLE / 2) % LIGHT_CYCLE;
  return u < LIGHT_GREEN ? "g" : u < LIGHT_GREEN + LIGHT_YELLOW ? "y" : "r";
}
const seaY = (() => { for (let y = 0; y < ROWS; y++) if (MAP[y].includes("w")) return y; return ROWS; })();

const wx = x => x - COLS / 2 + 0.5;  // map square x -> 3D world x
const wz = y => y - ROWS / 2 + 0.5;  // map square y -> 3D world z

function seeded(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const cityRand = seeded(CFG.seed);
const pick = (arr, r = cityRand) => arr[Math.floor(r() * arr.length)];

// ---------- saved settings & best score (kept in this browser only) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("poopRunCity." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("poopRunCity." + k, JSON.stringify(v)); } catch (e) {} },
};
const SETTINGS = Object.assign({ graphics: "High", sensitivity: "Medium", invertY: "Off", alwaysRun: "Off", fullscreen: "On", sound: "On" },
                               store.get("settings", {}));
let best = store.get("best", 0);
const HIGH = SETTINGS.graphics === "High";          // texture sizes are picked once, when the game loads
const TEX = HIGH ? 1 : 0.5;

// =========================================================
//  RENDERER, SKY, LIGHTS
// =========================================================
const wrap = document.getElementById("wrap"), stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.domElement.className = "three";
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
stage.prepend(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.02, 220);

function resize() {
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
document.addEventListener("fullscreenchange", () => setTimeout(resize, 50));
document.addEventListener("webkitfullscreenchange", () => setTimeout(resize, 50));

function applyGraphics() {
  const high = SETTINGS.graphics === "High";
  renderer.setPixelRatio(high ? Math.min(window.devicePixelRatio, 2) : 1);
  renderer.shadowMap.enabled = high;
  scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => (m.needsUpdate = true)); });
  resize();
}

// Full screen (needs a click or key press to start)
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen(force) {
  try {
    if (isFullscreen() && force !== true) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else if (!isFullscreen()) {
      const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
      if (req) { const p = req.call(wrap); if (p && p.catch) p.catch(() => {}); }
    }
  } catch (e) {}
}

function canvasTex(c, srgb = true, repeat = false) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = Math.max(4, Math.round(w)); c.height = Math.max(4, Math.round(h)); return c; }

// Sunset sky, also used for reflections on glass and cars
const skyCanvas = makeCanvas(4, 512);
{
  const g = skyCanvas.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, "#1b1540"); grad.addColorStop(0.35, "#5d3678"); grad.addColorStop(0.58, "#d65d6c");
  grad.addColorStop(0.74, "#ff9a5c"); grad.addColorStop(0.86, "#ffd29a"); grad.addColorStop(1, "#8a6a7a");
  g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
}
const skyTex = canvasTex(skyCanvas);
scene.background = skyTex;
scene.fog = new THREE.Fog("#d9806f", 12, 44);
{
  const envScene = new THREE.Scene();
  const t = canvasTex(skyCanvas);
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide })));
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 8), new THREE.MeshBasicMaterial({ color: "#fff0c8" }));
  sunBall.position.set(-35, 8, 30); envScene.add(sunBall);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;
}

scene.add(new THREE.HemisphereLight("#ffc9a8", "#2e2440", 0.55));
const sun = new THREE.DirectionalLight("#ffae6e", 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(HIGH ? 4096 : 1024, HIGH ? 4096 : 1024);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 0.5, far: 60 });
scene.add(sun, sun.target);
const SUN_OFFSET = new THREE.Vector3(-14, 10, 11);
function aimSun(x, z) { sun.target.position.set(x, 0, z); sun.position.set(x + SUN_OFFSET.x, SUN_OFFSET.y, z + SUN_OFFSET.z); }
{
  const c = makeCanvas(128, 128), g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  grad.addColorStop(0, "rgba(255,244,210,1)"); grad.addColorStop(0.25, "rgba(255,196,120,.9)"); grad.addColorStop(1, "rgba(255,140,90,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTex(c), fog: false, depthWrite: false, transparent: true }));
  s.position.set(-95, 12, 70); s.scale.set(42, 42, 1);
  scene.add(s);
}

// =========================================================
//  THE GROUND: streets, sidewalks, plaza, parking, parks, beach

  if (ch === "o") addGeo(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), waterMat, mat4(wx(x), 0.012, wz(y)));
  if (ch === "d") {
    addGeo(new THREE.BoxGeometry(1, 0.04, 1), woodMat, mat4(wx(x), 0.03, wz(y)));
    for (const [ox, oz] of [[-0.45, -0.45], [0.45, -0.45], [-0.45, 0.45], [0.45, 0.45]]) addGeo(new THREE.CylinderGeometry(0.025, 0.025, 0.6, 6), woodMat, mat4(wx(x) + ox, -0.25, wz(y) + oz));

    if (!"d".includes(tile(x + 1, y))) addGeo(new THREE.BoxGeometry(0.02, 0.12, 1), woodMat, mat4(wx(x) + 0.49, 0.11, wz(y)));
    if (tile(x, y + 1) === "w") addGeo(new THREE.BoxGeometry(1, 0.12, 0.02), woodMat, mat4(wx(x), 0.11, wz(y) + 0.49));

}

const rightOf = (dx, dy) => [-dy, dx];                    // cars drive on the right
// traffic lights: a pole on the corner with an arm over the lane and a red / yellow / green signal facing the drivers
const signalBoxMat = new THREE.MeshStandardMaterial({ color: "#1d2024", roughness: 0.5, metalness: 0.4 });

// one material per (light group, east-west / north-south, colour), so changing a light is just changing a material
const LAMP_MATS = [0, 1, 2].map(() => [0, 1].map(() => LAMP_COLORS.map(c => {
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(0.12) });   // "basic" = glows at full brightness
  m.userData.on = new THREE.Color(c).multiplyScalar(1.5); m.userData.off = m.color.clone(); m.userData.noShadow = true; return m;
})));
const LAMP_GEO = new THREE.CylinderGeometry(0.0155, 0.0155, 0.006, 16).rotateX(Math.PI / 2);
const VISOR_GEO = new THREE.CylinderGeometry(0.017, 0.017, 0.022, 14, 1, true, -Math.PI / 2, Math.PI).rotateX(Math.PI / 2).rotateZ(Math.PI);
for (const J of JUNCTIONS) {
  if (!J.lights) continue;
  for (const [dx, dy] of J.sides) {
    const [rx, ry] = rightOf(dx, dy);
    // the corner on the driver's right, just before the junction
    const cx = dx > 0 ? J.x0 - 0.5 : dx < 0 ? J.x1 + 0.5 : rx > 0 ? J.x1 + 0.5 : J.x0 - 0.5;
    const cy = dy > 0 ? J.y0 - 0.5 : dy < 0 ? J.y1 + 0.5 : ry > 0 ? J.y1 + 0.5 : J.y0 - 0.5;
    const px = cx - dx * 0.1 + rx * 0.1, py = cy - dy * 0.1 + ry * 0.1;
    if (isRoad(Math.round(px), Math.round(py))) continue;
    const face = Math.atan2(dx, dy), m = mat4(wx(px), 0, wz(py), face);   // local +z = driving direction, local -x = over the road
    const reach = 0.42;
    addGeo(new THREE.CylinderGeometry(0.009, 0.012, 0.6, 8).translate(0, 0.3, 0), darkMetal, m);
    addGeo(new THREE.CylinderGeometry(0.004, 0.005, reach, 6).rotateZ(Math.PI / 2).translate(reach / 2, 0.575, 0), darkMetal, m);
    // signal head hanging from the end of the arm, and a small one on the pole for people close by
    for (const [hx, hy, s] of [[reach - 0.02, 0.49, 1], [0, 0.33, 0.75]]) {
      const hm = m.clone().multiply(new THREE.Matrix4().makeTranslation(hx, hy, 0)).multiply(new THREE.Matrix4().makeScale(s, s, s));
      addGeo(new THREE.BoxGeometry(0.075, 0.155, 0.008).translate(0, 0, 0.012), signalPlateMat, hm);
      addGeo(new THREE.BoxGeometry(0.046, 0.128, 0.03), signalBoxMat, hm);
      for (let c = 0; c < 3; c++) {
        const ly = 0.04 - c * 0.04;
        addGeo(LAMP_GEO, LAMP_MATS[J.ctrl.group][dx !== 0 ? 0 : 1][c], hm.clone().multiply(new THREE.Matrix4().makeTranslation(0, ly, -0.016)));
        addGeo(VISOR_GEO, signalBoxMat, hm.clone().multiply(new THREE.Matrix4().makeTranslation(0, ly + 0.003, -0.026)));
      }
    }
    addObstacle(px, py, 0.02);
  }
}
const LIGHT_PROBES = [0, 1, 2].map(group => ({ lights: true, ctrl: { group } }));

      if (!clip) continue;

      acts[n].time = Math.random() * clip.duration;
    }
    let head = null;
    model.traverse(o => { if (o.isBone && /head$/i.test(o.name) && !head) head = o; });
    const bone = end => { let b = null; model.traverse(o => { if (o.isBone && !b && o.name.endsWith(end)) b = o; }); return b; };
    const arms = ["Left", "Right"].map(s => ({ up: bone(s + "Arm"), fore: bone(s + "ForeArm"), hand: bone(s + "Hand") }));
    g.userData = { mixer, acts, w: { Idle: 1, Walk: 0, Run: 0 }, head, arms: arms.every(a => a.up && a.fore && a.hand) ? arms : null };
    return g;
  }

                         limb(skin, 0.6, 0.1, -0.28, 1.38), limb(skin, 0.6, 0.1, 0.28, 1.38)], t: 0, head: headMesh };
  return g;
}

// Blend smoothly between standing, walking and running
function animateHuman(g, speed, runAt, dt) {
  const u = g.userData;
  if (u.mixer) {
    const state = speed < 0.04 ? "Idle" : speed > runAt ? "Run" : "Walk";
    for (const n in u.acts) {
      u.w[n] += ((n === state ? 1 : 0) - u.w[n]) * Math.min(1, dt * 9);
      u.acts[n].setEffectiveWeight(u.w[n]);
    }
    if (u.acts.Walk) u.acts.Walk.timeScale = Math.min(2.2, Math.max(0.7, speed / WALK_REF));
    if (u.acts.Run) u.acts.Run.timeScale = Math.min(2.2, Math.max(0.8, speed / RUN_REF));
    u.mixer.update(dt);
  } else {
    u.t += speed * dt * 22;
    const s = speed > 0.04 ? Math.sin(u.t) * 0.7 : 0;
    u.limbs[0].rotation.x = s; u.limbs[1].rotation.x = -s; u.limbs[2].rotation.x = -s * 0.8; u.limbs[3].rotation.x = s * 0.8;
  }
}

const faceTextures = {};
function faceTexture(url) {

  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const img = new Image();
  img.onload = () => {

    g.save(); g.beginPath(); g.ellipse(64, 80, 62, 78, 0, 0, Math.PI * 2); g.clip();      // oval face shape
    g.drawImage(img, (img.width - s) / 2, (img.height - s / 0.8) / 2, s, s / 0.8, 0, 0, 128, 160);
    g.restore();
    tex.needsUpdate = true;

  img.src = url;

}
const FACE = { w: 0.04, h: 0.05, up: 0.026, fwd: 0.034 };    // size and spot of the face (in map squares)
function addFace(g, url) {
  const u = g.userData;
  if (!url || !u.head || !u.head.isBone) return;
  const geo = new THREE.PlaneGeometry(FACE.w, FACE.h, 8, 8), P = geo.attributes.position;
  for (let i = 0; i < P.count; i++) { const x = P.getX(i); P.setZ(i, -x * x / FACE.w * 1.1); }   // curve it around the head
  geo.computeVertexNormals();
  const tex = faceTexture(url);
  const face = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, emissive: "#ffffff", emissiveMap: tex, emissiveIntensity: 0.5,
                                                                      roughness: 0.8, transparent: true, alphaTest: 0.4 }));
  // fix the face to the head bone, so it nods and turns with the head
  g.updateMatrixWorld(true);
  const hp = new THREE.Vector3(), hq = new THREE.Quaternion(), hs = new THREE.Vector3();
  u.head.matrixWorld.decompose(hp, hq, hs);
  face.position.copy(u.head.worldToLocal(new THREE.Vector3(hp.x, hp.y + FACE.up, hp.z + FACE.fwd)));
  face.quaternion.copy(hq.invert());
  face.scale.set(1 / hs.x, 1 / hs.y, 1 / hs.z);
  face.name = "rankFace";
  u.head.add(face);
}

function mergedGeometry(items) {
  const pos = [], nor = [], uv = [], v = new THREE.Vector3(), n = new THREE.Vector3(), nm = new THREE.Matrix3();

let S = null;
const rand = Math.random;
const PLAYER_R = 0.07;   // how "wide" a person is when bumping into things
const COP_HIT = 0.2;     // a police officer this close catches you
const EAT_DIST = 0.24;
const START = CFG.start;

function characterIndex(eaten) { let idx = 0; CFG.characters.forEach((c, i) => { if (eaten >= c.needs) idx = i; }); return idx; }
function wantedStars() { return Math.min(CFG.max_stars, 1 + Math.floor(S.eaten / CFG.poop_per_star)); }
const copSpeed = () => 1000 / Math.max(300, CFG.police_speed_ms - (wantedStars() - 1) * CFG.police_speed_step);

const RUN_AT = 0.8;      // faster than this = running animation

const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const manhattan = (x1, y1, x2, y2) => Math.abs(x1 - x2) + Math.abs(y1 - y2);

// Does a person at (x, y) bump into a building, tree, lamp, water or the edge of the city?
function bumps(x, y, r = PLAYER_R) {
  if (x < -0.5 + r || y < -0.5 + r || x > COLS - 0.5 - r || y > ROWS - 0.5 - r) return true;
  const rx = Math.round(x), ry = Math.round(y);
  for (let ty = ry - 1; ty <= ry + 1; ty++) for (let tx = rx - 1; tx <= rx + 1; tx++) {
    if (!inside(tx, ty)) continue;
    const ch = MAP[ty][tx];
    if (ch === "w" || ch === "o") {
      const cx = Math.max(tx - 0.5, Math.min(x, tx + 0.5)), cy = Math.max(ty - 0.5, Math.min(y, ty + 0.5));
      if ((cx - x) ** 2 + (cy - y) ** 2 < r * r) return true;
    }
    for (const b of BUCKET[ty][tx]) {
      const cx = Math.max(b.x0, Math.min(x, b.x1)), cy = Math.max(b.y0, Math.min(y, b.y1));
      if ((cx - x) ** 2 + (cy - y) ** 2 < r * r) return true;
    }
    for (const o of OBST[ty][tx]) if (Math.hypot(o.x - x, o.y - y) < r + o.r) return true;
  }
  return false;
}

// Places poop can appear: streets, parks, plaza, beach and along the sidewalks
const SPOTS = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!isWall(x, y)) SPOTS.push([x, y]);
for (const R of RECTS) {
  const x0 = R.x - 0.5, x1 = R.x + R.w - 0.5, y0 = R.y - 0.5, y1 = R.y + R.h - 0.5;
  for (let t = 0.5; t < R.w; t += 1) { if (R.iT) SPOTS.push([x0 + t, y0 + R.iT / 2]); if (R.iB) SPOTS.push([x0 + t, y1 - R.iB / 2]); }
  for (let t = 0.5; t < R.h; t += 1) { if (R.iL) SPOTS.push([x0 + R.iL / 2, y0 + t]); if (R.iR) SPOTS.push([x1 - R.iR / 2, y0 + t]); }
}
for (let i = SPOTS.length - 1; i >= 0; i--) if (bumps(SPOTS[i][0], SPOTS[i][1], 0.1)) SPOTS.splice(i, 1);

function navTile(x, y) {

  if (!isWall(rx, ry)) return [rx, ry];
  let bestT = [rx, ry], bestD = Infinity;
  for (let ty = ry - 1; ty <= ry + 1; ty++) for (let tx = rx - 1; tx <= rx + 1; tx++) {
    const d = Math.hypot(tx - x, ty - y);

function farCrossroads(minDist) {
  const [tx, ty] = playerTile();

// ---------- You: move the way the camera is looking ----------
function updatePlayer(now, dt) {
  const p = S.player, inp = readMove();
  p.moving = inp.mag > 0.1;
  let speed = 0;
  if (p.moving) {
    const fx = Math.sin(cam.yaw), fy = Math.cos(cam.yaw), rx = Math.sin(cam.yaw - Math.PI / 2), ry = Math.cos(cam.yaw - Math.PI / 2);
    let mx = fx * inp.fwd + rx * inp.side, my = fy * inp.fwd + ry * inp.side;
    const l = Math.hypot(mx, my) || 1; mx /= l; my /= l;
    p.ang += angDiff(Math.atan2(mx, my), p.ang) * Math.min(1, dt * 12);
    speed = inp.run ? runSpeed() : WALK_SPEED * Math.max(0.4, inp.mag);
    const step = speed * dt;
    const inCar = (x, y) => S.cars.some(c => carBoxDist(c, x, y) < PLAYER_R);
    const free = (x, y) => !bumps(x, y) && (!inCar(x, y) || inCar(p.x, p.y));   // cars are solid (unless one already drove into you)

// ---------- Police AI: breadth-first search, then chase you on foot ----------
// Works out how many steps every walkable square is from you.
function distanceMap() {
  const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
  const [px, py] = playerTile();
  const queue = [[px, py]];
  dist[py][px] = 0;
  for (let qi = 0; qi < queue.length; qi++) {
    const [x, y] = queue[qi];
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!isWall(nx, ny) && dist[ny][nx] === Infinity) { dist[ny][nx] = dist[y][x] + 1; queue.push([nx, ny]); }
    }
  }
  return dist;
}
function updateCops(now, dt) {
  if (!S.nav || now - S.navT > 250) { S.nav = distanceMap(); S.navT = now; }
  const sp = copSpeed(), p = S.player;
  S.police.forEach((c, i) => {
    let tx, ty;
    const dp = Math.hypot(p.x - c.x, p.y - c.y);
    if (dp < 1.6 && clearLine(c.x, c.y, p.x, p.y)) { tx = p.x; ty = p.y; c.wp = null; }   // close and can see you: run straight at you
    else {
      if (!c.wp || Math.hypot(c.wp[0] - c.x, c.wp[1] - c.y) < 0.1) {
        const [cx, cy] = navTile(c.x, c.y);
        if (Math.hypot(cx - c.x, cy - c.y) > 0.14) c.wp = [cx, cy];
        else {
          const opts = DIRS.map(([dx, dy]) => [cx + dx, cy + dy]).filter(([x, y]) => !isWall(x, y));
          if (opts.length) c.wp = i > 0 && rand() < CFG.police_randomness * 0.4 ? pick(opts, rand)
                                 : opts.reduce((a, b) => (S.nav[b[1]][b[0]] < S.nav[a[1]][a[0]] ? b : a));
        }
      }
      [tx, ty] = c.wp || [c.x, c.y];
    }
    let mx = tx - c.x, my = ty - c.y; const l = Math.hypot(mx, my);
    if (l > 0.01) {
      mx /= l; my /= l;
      const step = Math.min(l, sp * dt), nx = c.x + mx * step, ny = c.y + my * step;
      if (!bumps(nx, c.y, 0.06)) c.x = nx;
      if (!bumps(c.x, ny, 0.06)) c.y = ny;
      c.ang += angDiff(Math.atan2(mx, my), c.ang) * Math.min(1, dt * 10);
      c.speedNow = sp;
    } else c.speedNow = 0;
  });
  // officers don't stand inside each other
  for (let i = 0; i < S.police.length; i++) for (let j = i + 1; j < S.police.length; j++) {
    const a = S.police[i], b = S.police[j], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d > 0.001 && d < 0.16) { const push = (0.16 - d) / 2, ux = (a.x - b.x) / d, uy = (a.y - b.y) / d;
      if (!bumps(a.x + ux * push, a.y + uy * push, 0.06)) { a.x += ux * push; a.y += uy * push; }
      if (!bumps(b.x - ux * push, b.y - uy * push, 0.06)) { b.x -= ux * push; b.y -= uy * push; } }
  }
}

// =========================================================
//  TRAFFIC AI: cars keep to their lane, stop at red lights, queue behind other cars
//  and brake for anyone standing in the road in front of them
// =========================================================
const CAR_HALF = 0.46, CAR_HALF_W = 0.19;
const CAR_ACCEL = 1.3, CAR_BRAKE = 3.2, CAR_BRAKE_MAX = 9;  // squares per second per second
const STOP_BACK = 0.8;          // how far before the junction a car's centre stops (front bumper at the white stop line)
const TURN_SPEED = 1.05;        // cars slow down to this to turn a corner
const LOOK_AHEAD = 3.0;         // how far ahead (squares) a driver watches for cars and people
// On a two-square-wide road, each square is one lane. A car on the left one is going the wrong way.
function wrongLane(x, y, dx, dy) { const [rx, ry] = rightOf(dx, dy); return isRoad(x + rx, y + ry) && !isRoad(x - rx, y - ry); }
function laneOffset(x, y, dx, dy) {
  const [rx, ry] = rightOf(dx, dy), R = isRoad(x + rx, y + ry), L = isRoad(x - rx, y - ry);
  return R !== L ? 0 : 0.23;     // avenue lane: drive in the middle of it. Narrow street: keep to the right half.
}
const laneOk = (x, y, dx, dy) => isRoad(x, y) && !wrongLane(x, y, dx, dy);
const dirOf = (a, b) => [b[0] - a[0], b[1] - a[1]];

// Plan a few squares ahead: mostly straight on, sometimes turn at a junction (never into the wrong lane)
function planRoute(car) {
  while (car.path.length < 8) {
    const n = car.path.length, B = car.path[n - 1], A = n > 1 ? car.path[n - 2] : car.back;
    const [dx, dy] = dirOf(A, B);
    const P = n > 2 ? car.path[n - 3] : (n > 1 ? car.back : null);
    const justTurned = P && (dirOf(P, A)[0] !== dx || dirOf(P, A)[1] !== dy);
    const opts = [];
    if (laneOk(B[0] + dx, B[1] + dy, dx, dy)) opts.push([dx, dy, 3]);
    const JB = isJ(B[0], B[1]) ? JUNC[B[1]][B[0]] : null;
    const linked = (x, y) => JB && JB.ctrl && isJ(x, y) && JUNC[y][x] !== JB && JUNC[y][x].ctrl === JB.ctrl;   // don't turn straight into a linked junction
    if (!justTurned) for (const [tx, ty] of [[dy, dx], [-dy, -dx]])
      if (laneOk(B[0] + tx, B[1] + ty, tx, ty) && laneOk(B[0] + 2 * tx, B[1] + 2 * ty, tx, ty) && !linked(B[0] + 2 * tx, B[1] + 2 * ty) && !linked(B[0] + 3 * tx, B[1] + 3 * ty))
        opts.push([tx, ty, opts.length ? 1.2 : 1]);
    if (!opts.length) for (const [tx, ty] of [[dx, dy], [dy, dx], [-dy, -dx]]) if (isRoad(B[0] + tx, B[1] + ty)) opts.push([tx, ty, 1]);
    if (!opts.length) opts.push([-dx, -dy, 1]);           // dead end: turn around
    let r = rand() * opts.reduce((s, o) => s + o[2], 0), c = opts[0];
    for (const o of opts) { r -= o[2]; if (r <= 0) { c = o; break; } }
    car.path.push([B[0] + c[0], B[1] + c[1]]);
  }
}

// Where the car's centre will be after driving t more squares (corners are driven as smooth curves)
function carPoint(car, t) {
  let i = 0, f = car.s + t;
  while (f >= 1 && i < car.path.length - 2) { f -= 1; i++; }
  const A = car.path[i], B = car.path[i + 1], Pr = i > 0 ? car.path[i - 1] : car.back, Nx = car.path[i + 2];
  const d0 = dirOf(A, B);
  let x, y, hx = d0[0], hy = d0[1];
  const curve = (C, da, db, u) => {       // quarter circle-ish curve through corner square C
    const E = [C[0] - da[0] * 0.5, C[1] - da[1] * 0.5], X = [C[0] + db[0] * 0.5, C[1] + db[1] * 0.5];
    x = (1 - u) * (1 - u) * E[0] + 2 * u * (1 - u) * C[0] + u * u * X[0];
    y = (1 - u) * (1 - u) * E[1] + 2 * u * (1 - u) * C[1] + u * u * X[1];
    hx = (1 - u) * (C[0] - E[0]) + u * (X[0] - C[0]); hy = (1 - u) * (C[1] - E[1]) + u * (X[1] - C[1]);
  };
  const turnAt = (da, db) => (da[0] !== db[0] || da[1] !== db[1]) && (da[0] !== -db[0] || da[1] !== -db[1]);
  const d1 = Nx ? dirOf(B, Nx) : d0, dm = dirOf(Pr, A);
  if (f >= 0.5 && turnAt(d0, d1)) curve(B, d0, d1, f - 0.5);
  else if (f < 0.5 && turnAt(dm, d0)) curve(A, dm, d0, f + 0.5);
  else { x = A[0] + d0[0] * f; y = A[1] + d0[1] * f; }
  const l = Math.hypot(hx, hy) || 1; hx /= l; hy /= l;
  const [rx, ry] = rightOf(hx, hy);
  return { x: x + rx * car.k, y: y + ry * car.k, hx, hy };
}

// distance from point (x, y) to car o's body
function carBoxDist(o, x, y) {
  const ex = x - o.px, ey = y - o.py, f = ex * o.hx + ey * o.hy, l = -ex * o.hy + ey * o.hx;
  return Math.hypot(Math.max(0, Math.abs(f) - CAR_HALF), Math.max(0, Math.abs(l) - CAR_HALF_W));

// people: [{x, y, player}] standing or walking around
function driveCar(car, dt, people) {
  const vmax = car.vmax;
  let gap = Infinity, why = "", blocker = null;
  const limit = (g, w, o = null) => { if (g < gap) { gap = g; why = w; blocker = o; } };
  // 1) traffic lights: find the next junction this car will drive into
  for (let j = 1; j < car.path.length; j++) {
    const T = car.path[j], Pv = car.path[j - 1];

    const J = JUNC[T[1]][T[0]], [dx] = dirOf(Pv, T);
    let committed = false;                       // already driving through linked junctions on green
    for (let k = 0; k < j; k++) { const Q = car.path[k]; if (isJ(Q[0], Q[1]) && J.ctrl && JUNC[Q[1]][Q[0]].ctrl === J.ctrl) committed = true; }

    if (stopD > LOOK_AHEAD + 1) break;
    if (!committed && stopD > -0.08) {
      const light = lightFor(J, dx !== 0 ? 0 : 1);
      if (light === "r" || (light === "y" && !car.goYellow && stopD > car.v * car.v / (2 * CAR_BRAKE))) limit(stopD, "light");

      // don't drive into the junction if there's no room on the other side
      let e = j; while (e < car.path.length && isJ(car.path[e][0], car.path[e][1])) e++;
      const X = car.path[e];

        limit(stopD, "box");
    }
    if (stopD < -0.08) car.goYellow = false;     // past the stop line: decide again at the next junction
    break;
  }
  // 2) cars and people in the lane ahead
  const ghost = trafficClock < car.ghostUntil;
  for (let t = 0.3; t <= LOOK_AHEAD && t < gap + CAR_HALF + 0.4; t += 0.15) {
    const p = carPoint(car, t);
    let hit = false;
    if (!ghost) for (const o of S.cars) {
      if (o === car || o.hx * p.hx + o.hy * p.hy < -0.6) continue;     // oncoming traffic is in the other lane
      if (carBoxDist(o, p.x, p.y) < CAR_HALF_W) { limit(t - CAR_HALF - 0.62, "car", o); hit = true; break; }
    }
    if (hit) break;
    for (const h of people) if (Math.hypot(h.x - p.x, h.y - p.y) < 0.3) { limit(t - CAR_HALF - 0.22, h.player ? "player" : "person"); hit = true; break; }
    if (hit) break;
  }

  let target = gap <= 0 ? 0 : Math.min(vmax, Math.sqrt(2 * CAR_BRAKE * gap));

    const a = dirOf(car.path[j - 1], car.path[j]), b = dirOf(car.path[j], car.path[j + 1]);
    if (a[0] !== b[0] || a[1] !== b[1]) { const d = Math.max(0, j - car.s - 0.5); target = Math.min(target, Math.sqrt(TURN_SPEED * TURN_SPEED + 2 * CAR_BRAKE * d)); break; }
    if (j - car.s > 2.5) break;

  let deadlock = false;
  for (let o = car.blocker, n = 0; o && n < 20; o = o.blocker, n++) if (o === car) { deadlock = true; break; }
  if (car.v < 0.05 && deadlock) { car.wait += dt; if (car.wait > 2 + rand() * 2) { car.ghostUntil = trafficClock + 1.6; car.wait = 0; } }
  else car.wait = 0;

  car.s += car.v * dt;

}
// Put a new car on a random street square (not in a junction, not near (ax, ay))
function spawnCar(ax, ay, mesh) {
  for (let tries = 0; tries < 300; tries++) {
    const x = Math.floor(rand() * COLS), y = Math.floor(rand() * ROWS);
    if (!isRoad(x, y) || isJ(x, y) || Math.hypot(x - ax, y - ay) < 5) continue;
    const dirs = DIRS.filter(([dx, dy]) => laneOk(x, y, dx, dy) && isRoad(x + dx, y + dy) && !isJ(x + dx, y + dy));
    if (!dirs.length) continue;
    const [dx, dy] = pick(dirs, rand);
    if (S.cars.some(o => Math.hypot(o.px - x, o.py - y) < 1.6)) continue;
    const k = laneOffset(x, y, dx, dy);
    const car = { path: [[x, y], [x + dx, y + dy]], back: [x - dx, y - dy], s: 0, v: 0, vmax: (1000 / CFG.car_speed_ms) * (0.85 + rand() * 0.25),

  const g = radarMap.getContext("2d");
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    g.fillStyle = { ".": "#8e8e8e", g: "#4f8f3a", T: "#4f8f3a", s: "#cdb98a", w: "#2d5f80", o: "#2d5f80", p: "#a89c88", k: "#777", d: "#8a6a4a" }[MAP[y][x]] || "#34343b";
    g.fillRect(x * RT, y * RT, RT, RT);
  }
}
const radar = document.getElementById("radar").getContext("2d");
function drawRadar(now) {
  const W = 300, p = S.player;
  radar.fillStyle = "#2d5f80"; radar.fillRect(0, 0, W, W);
  radar.save();
  radar.translate(W / 2, W / 2); radar.scale(2, 2); radar.rotate(cam.yaw - Math.PI);
  radar.drawImage(radarMap, -(p.x + 0.5) * RT, -(p.y + 0.5) * RT);
  const dot = (x, y, color, r) => { radar.fillStyle = color; radar.beginPath(); radar.arc((x - p.x) * RT, (y - p.y) * RT, r, 0, 6.29); radar.fill(); };
  S.cars.forEach(c => dot(c.px, c.py, "#d8dde3", 1.8));
  S.poops.forEach(q => dot(q.x, q.y, q.golden ? "#ffd23f" : "#8a5a2b", 2.6));
  S.police.forEach((c, i) => dot(c.x, c.y, Math.floor(now / 250 + i) % 2 ? "#ff2030" : "#3070ff", 3.6));
  radar.restore();
  radar.fillStyle = "white"; radar.strokeStyle = "rgba(0,0,0,.8)"; radar.lineWidth = 2;
  radar.beginPath(); radar.arc(W / 2, W / 2, 6, 0, 6.29); radar.fill(); radar.stroke();
}

// =========================================================
//  CAMERA: free orbit around you (hold right mouse button / drag on phone)
// =========================================================
const cam = { yaw: Math.PI, pitch: 0.26, dist: 1.25, curD: 1.25, lastInput: -1e9 };
const TARGET_H = HUMAN_H * 0.82;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function insideBuilding(x, y, h) {
  const tx = Math.round(x), ty = Math.round(y);
  if (!inside(tx, ty)) return false;
  return BUCKET[ty][tx].some(b => x > b.x0 - 0.04 && x < b.x1 + 0.04 && y > b.y0 - 0.04 && y < b.y1 + 0.04 && h < b.h + 0.1);
}
function updateGameCamera(now, dt) {
  const p = S.player;
  if (p.moving && now - cam.lastInput > 2500) cam.yaw += angDiff(p.ang, cam.yaw) * Math.min(1, dt * 0.8);
  const bx = -Math.sin(cam.yaw), by = -Math.cos(cam.yaw), tanp = Math.tan(cam.pitch);
  const hd = cam.dist * Math.cos(cam.pitch);
  let lim = hd;
  for (let s = 0.08; s <= hd; s += 0.03) {
    if (insideBuilding(p.x + bx * s, p.y + by * s, TARGET_H + tanp * s)) { lim = Math.max(0.15, s - 0.08); break; }
  }
  cam.curD = lim < cam.curD ? lim : cam.curD + (lim - cam.curD) * Math.min(1, dt * 3);
  const d = cam.curD;
  camPos.set(wx(p.x + bx * d), Math.max(0.05, TARGET_H + tanp * d), wz(p.y + by * d));
  camLook.set(wx(p.x), TARGET_H, wz(p.y));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  aimSun(camLook.x, camLook.z);
}
function updateMenuCamera(now) {
  const a = now * 0.000028;
  camera.position.set(Math.sin(a) * 17, 7.5, Math.cos(a) * 13 + 2);
  camera.lookAt(0, 2.2, -2);
  aimSun(0, -2);
}

const SENS = { Low: 0.0035, Medium: 0.006, High: 0.0095 };
let dragId = null, lastX = 0, lastY = 0;
stage.addEventListener("contextmenu", e => e.preventDefault());
stage.addEventListener("pointerdown", e => {
  if (mode !== "play" && mode !== "dying") return;
  if (e.pointerType === "mouse" && e.button !== 2) return;   // right mouse button turns the camera
  if (e.target.closest && e.target.closest("button, #joy")) return;
  dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
stage.addEventListener("pointermove", e => {
  if (e.pointerId !== dragId) return;
  const s = SENS[SETTINGS.sensitivity] * (e.pointerType === "mouse" ? 1 : 1.4);
  cam.yaw -= (e.clientX - lastX) * s;
  cam.pitch += (e.clientY - lastY) * s * (SETTINGS.invertY === "On" ? -1 : 1);
  cam.pitch = Math.max(-0.1, Math.min(1.3, cam.pitch));
  lastX = e.clientX; lastY = e.clientY;
  cam.lastInput = performance.now();
});
const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", e => {
  if (mode !== "play") return;
  e.preventDefault();
  cam.dist = Math.max(0.45, Math.min(4, cam.dist * (e.deltaY > 0 ? 1.1 : 0.9)));
}, { passive: false });

// =========================================================
//  MENUS: main menu, panels, pause, game over
// =========================================================
let mode = "loading";   // loading | menu | play | paused | dying | over
const hudEl = document.getElementById("hud"), menuEl = document.getElementById("menu");
const cardsEl = document.getElementById("cards"), panelEl = document.getElementById("panel"), ibarEl = document.getElementById("ibar");

const CARDS = [
  { id: "play", label: "PLAY", sub: "Eat. Run. Escape.", icon: "💩", art: "linear-gradient(160deg, #ffb36b, #c2456e 55%, #3a1f5c)" },
  { id: "characters", label: "CHARACTERS", sub: "Who you can become", icon: "🏃", art: "linear-gradient(160deg, #3fb7a4, #1d4f6e 60%, #101828)" },
  { id: "controls", label: "CONTROLS", sub: "Keyboard, mouse, touch", icon: "🎮", art: "linear-gradient(160deg, #8a8fa8, #3a3f5c 60%, #14141f)" },
  { id: "settings", label: "SETTINGS", sub: "Graphics & camera", icon: "⚙️", art: "linear-gradient(160deg, #e0b85a, #8a5a2b 60%, #2a1a10)" },
  { id: "credits", label: "CREDITS", sub: "Who made this", icon: "🎬", art: "linear-gradient(160deg, #e06a6a, #6a1f3a 60%, #1a0a14)" },
];
const OPTIONS = { graphics: ["High", "Low"], sensitivity: ["Low", "Medium", "High"], invertY: ["Off", "On"], alwaysRun: ["Off", "On"], fullscreen: ["On", "Off"], sound: ["On", "Off"] };
const M = { where: "cards", card: 0, panel: null, row: 0, back: null };

function panelDef(id) {
  const info = (label, value) => ({ label, value, info: true });
  const setting = (label, key, after) => ({ label, value: () => "◀ " + SETTINGS[key] + " ▶", change: dir => {
    const o = OPTIONS[key], i = (o.indexOf(SETTINGS[key]) + dir + o.length) % o.length;
    SETTINGS[key] = o[i]; store.set("settings", SETTINGS); if (after) after();
  } });
  switch (id) {
    case "characters": return { title: "CHARACTERS", rows: CFG.characters.map((c, i) =>
      info((c.image ? '<span class="thumb" style="background-image:url(&quot;' + c.image + '&quot;)"></span>' : '<span style="color:' + c.color + '">■</span> ') + c.name,
           i === 0 ? "Rank 1 - you start here" : "Rank " + (i + 1) + " - eat " + c.needs + " 💩")),
      desc: "Every character you unlock runs faster than the one before. Golden poop is worth 3." };
    case "controls": return { title: "CONTROLS", rows: [
      info("Move", "W A S D / arrow keys"), info("Run", "Hold Shift"), info("Look around", "Hold right mouse button + drag"),
      info("Zoom camera", "Mouse wheel"), info("Camera behind you", "C"), info("Full screen", "F or ⛶"), info("Pause menu", "Esc or P"),
      info("Phone: move / run", "Joystick (all the way = run)"), info("Phone: look around", "Drag on the screen") ],
      desc: "You walk the way the camera faces. Cars stop at red lights and brake for people in front of them, but they can't stop instantly. Police chase you on foot." };
    case "settings": return { title: "SETTINGS", rows: [
      setting("Graphics (shadows, sharpness)", "graphics", applyGraphics), setting("Full screen when you press Play", "fullscreen"),
      setting("Camera speed", "sensitivity"), setting("Invert camera up/down", "invertY"), setting("Always run", "alwaysRun"), setting("Sound effects", "sound") ],
      desc: "Low graphics turns off shadows and uses smaller textures (after a reload). Use it if the game is slow." };
    case "credits": return { title: "CREDITS", rows: [
      info("Game", "Our class group · KMIDS"), info("Made with", "Python, Streamlit, Three.js"),
      info("People models", "Soldier & X Bot (three.js examples)"), info("Animations", "Mixamo"), info("Police AI", "Breadth-first search") ],
      desc: "A practice project for 'Build Your First AI Project'. All characters and places are made up." };
    case "pause": return { title: "PAUSED", rows: [
      { label: "Resume", act: resume }, { label: "Full screen on / off", act: () => toggleFullscreen() },
      { label: "Controls", act: () => openPanel("controls", "pause") }, { label: "Settings", act: () => openPanel("settings", "pause") },
      { label: "Quit to main menu", act: showMain } ],
      desc: "Score " + S.eaten + " 💩 · " + "★".repeat(S.stars) + " · " + CFG.characters[S.charIdx].name };
    case "over": return { title: "GAME OVER", rows: [ { label: "Play again", act: startGame }, { label: "Main menu", act: showMain } ],
      desc: "You ate " + S.eaten + " 💩 and became " + CFG.characters[S.charIdx].name + ". Best: " + best + "." };
  }
}
const FS_BTN = '<button class="ibtn fsbtn">⛶ Full screen</button>';
function renderMenu() {
  cardsEl.classList.toggle("hidden", M.where !== "cards");
  panelEl.classList.toggle("hidden", M.where !== "panel");
  if (M.where === "cards") {
    cardsEl.innerHTML = CARDS.map((c, i) =>
      '<div class="card' + (i === M.card ? " sel" : "") + '" data-i="' + i + '"><div class="art" style="background:' + c.art + '">' + c.icon +
      '</div><div class="lbl">' + c.label + "<small>" + c.sub + "</small></div></div>").join("");
    ibarEl.innerHTML = FS_BTN + "<span class='mouseonly'><b>⏎</b>Select</span><span class='mouseonly'><b>← →</b>Navigate</span>";
  } else {
    const p = panelDef(M.panel);
    panelEl.innerHTML = '<div class="phead">' + p.title + "</div>" + p.rows.map((r, i) => {
      const v = typeof r.value === "function" ? r.value() : (r.value || "");
      return '<div class="row' + (i === M.row && !r.info ? " sel" : "") + (r.info ? " info" : "") + '" data-i="' + i + '"><span>' + r.label + '</span><span class="v">' + v + "</span></div>";
    }).join("") + (p.desc ? '<div class="pdesc">' + p.desc + "</div>" : "");
    ibarEl.innerHTML = FS_BTN + "<span class='mouseonly'><b>⏎</b>Select</span><span class='mouseonly'><b>↑ ↓</b>Navigate</span>" +
      (p.rows.some(r => r.change) ? "<span class='mouseonly'><b>◀ ▶</b>Change</span>" : "") + (M.back !== null ? "<span class='mouseonly'><b>Esc</b>Back</span>" : "");
  }
  ibarEl.querySelectorAll(".fsbtn").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); toggleFullscreen(); }));
}
function selectable(p) { return p.rows.map((r, i) => (r.info ? -1 : i)).filter(i => i >= 0); }
function openPanel(id, back = "cards") {
  if (id === "pause" || id === "over") { mode = id === "pause" ? "paused" : "over"; back = id === "pause" ? "resume" : null; }
  M.where = "panel"; M.panel = id; M.back = back;
  const sel = selectable(panelDef(id)); M.row = sel.length ? sel[0] : 0;
  menuEl.classList.remove("hidden");
  menuEl.classList.toggle("dark", mode !== "menu");
  document.getElementById("mtop").classList.toggle("hidden", mode !== "menu");
  renderMenu();
}
function menuBack() {
  if (M.back === "cards") { M.where = "cards"; renderMenu(); }
  else if (M.back === "pause") openPanel("pause");
  else if (M.back === "resume") resume();
}
function menuActivate() {
  if (M.where === "cards") { const id = CARDS[M.card].id; if (id === "play") startGame(); else openPanel(id, "cards"); return; }
  const r = panelDef(M.panel).rows[M.row];
  if (!r) return;
  if (r.act) r.act(); else if (r.change) { r.change(1); renderMenu(); }
}
function menuMove(dx, dy) {
  if (M.where === "cards") { M.card = (M.card + dx + dy + CARDS.length) % CARDS.length; renderMenu(); return; }
  const p = panelDef(M.panel), sel = selectable(p);
  if (dy && sel.length) { const j = sel.indexOf(M.row); M.row = sel[(j + dy + sel.length) % sel.length]; }
  if (dx && p.rows[M.row] && p.rows[M.row].change) p.rows[M.row].change(dx);
  renderMenu();
}
menuEl.addEventListener("pointermove", e => {
  const el = e.target.closest("[data-i]"); if (!el || e.pointerType !== "mouse") return;
  const i = +el.dataset.i;
  if (M.where === "cards" && i !== M.card) { M.card = i; renderMenu(); }
  if (M.where === "panel" && i !== M.row && !panelDef(M.panel).rows[i].info) { M.row = i; renderMenu(); }
});
menuEl.addEventListener("click", e => {
  const el = e.target.closest("[data-i]"); if (!el) return;
  const i = +el.dataset.i;
  if (M.where === "cards") { M.card = i; menuActivate(); }
  else if (!panelDef(M.panel).rows[i].info) { M.row = i; menuActivate(); }
});

function showMain() {
  renderer.domElement.style.filter = "";
  mode = "menu";
  hudEl.classList.add("hidden");
  menuEl.classList.remove("hidden", "dark");
  document.getElementById("mtop").classList.remove("hidden");
  M.where = "cards"; M.back = null;
  renderMenu();
}
function startGame() {
  if (SETTINGS.fullscreen === "On") toggleFullscreen(true);
  newGame();
  mode = "play";
  const now = performance.now();
  S.safeUntil = now + 2500;
  menuEl.classList.add("hidden");
  hudEl.classList.remove("hidden");
  showTip("Eat 💩 to level up (you can eat while you run). Cars stop at red lights and brake for you - but not instantly, so look before you cross. " +
          "The more you eat, the more police officers chase you.<br><br><b>Hold right mouse button</b> to look around · <b>Shift</b> to run · <b>F</b> full screen · <b>Esc</b> menu", now, 9000);
}
function pause() { openPanel("pause"); }
function resume() { menuEl.classList.add("hidden"); mode = "play"; }

// ---------- keyboard ----------
const MOVE_KEYS = ["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", "shift"];
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "f" && mode !== "loading") { e.preventDefault(); toggleFullscreen(); return; }
  if (mode === "menu" || mode === "paused" || mode === "over") {
    const nav = { arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0], arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1] };
    if (nav[k]) { e.preventDefault(); menuMove(...nav[k]); }
    else if (k === "enter" || k === " ") { e.preventDefault(); menuActivate(); }
    else if (k === "escape" || k === "backspace") { e.preventDefault(); menuBack(); }
    return;
  }
  if (mode !== "play" && mode !== "dying") return;
  if (k === "escape" || k === "p") { e.preventDefault(); if (mode === "play") pause(); return; }
  if (MOVE_KEYS.includes(k)) { e.preventDefault(); keys[k] = true; }
  if (k === "c") { cam.yaw = S.player.ang; cam.lastInput = performance.now(); }
});
document.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll("#hud .fsbtn").forEach(b => b.addEventListener("click", () => toggleFullscreen()));
document.getElementById("pauseBtn").addEventListener("click", () => { if (mode === "play") pause(); });

// ---------- phone joystick ----------
const joyEl = document.getElementById("joy"), knob = document.getElementById("knob");
let joyId = null;
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2 - 20, len = Math.hypot(dx, dy);
  if (len > max) { dx *= max / len; dy *= max / len; }
  joy.x = dx / max; joy.y = dy / max;
  knob.style.transform = "translate(" + dx + "px, " + dy + "px)";
}
joyEl.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); joyId = e.pointerId; try { joyEl.setPointerCapture(e.pointerId); } catch (err) {} moveJoy(e); });
joyEl.addEventListener("pointermove", e => { if (e.pointerId === joyId) moveJoy(e); });
const endJoy = e => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = 0; knob.style.transform = ""; };
joyEl.addEventListener("pointerup", endJoy);
joyEl.addEventListener("pointercancel", endJoy);

// =========================================================
//  MAIN LOOP
// =========================================================
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  waterTex.offset.x += dt * 0.01; waterTex.offset.y += dt * 0.006;
  if (S) {
    if (mode === "play") {
      updatePlayer(now, dt);
      updateCops(now, dt);
      updateTraffic(dt);
      checkHit(now);
    } else if (mode === "menu" || mode === "dying") {
      updateTraffic(dt);                 // the city stays alive behind the menu
      if (mode === "dying" && now > S.dieUntil) afterCaught(now);
    }
    const frozen = mode === "paused" || mode === "over";
    if (!frozen) updatePeds(dt);

    const p = S.player, pm = p.mesh;
    pm.position.set(wx(p.x), 0, wz(p.y));
    pm.rotation.y = p.ang;
    pm.visible = !(mode === "play" && now < S.safeUntil && Math.floor(now / 130) % 2 === 0);
    if (!frozen) { animateHuman(pm, mode === "play" ? p.speedNow : 0, RUN_AT, dt); updateHamster(p, dt, now); }
    for (const c of S.police) {
      c.mesh.position.set(wx(c.x), 0, wz(c.y));
      c.mesh.rotation.y = c.ang;
      if (!frozen) animateHuman(c.mesh, mode === "play" ? c.speedNow : 0, RUN_AT, dt);
      placeCap(c);
    }
    for (const car of S.cars) {
      car.mesh.position.set(wx(car.px), 0, wz(car.py));
      car.mesh.rotation.y += angDiff(Math.atan2(car.hx, car.hy), car.mesh.rotation.y) * Math.min(1, dt * 16);
      car.mesh.userData.tail.emissiveIntensity = car.braking ? 4.5 : 1.1;     // brake lights
    }
    S.poops.forEach((q, i) => { q.mesh.rotation.y += q.golden ? 0.04 : 0.015; q.mesh.position.y = Math.sin(now / 300 + i) * 0.012 + 0.008; });

    if (mode === "menu") updateMenuCamera(now); else updateGameCamera(now, dt);
    if (now > S.msgUntil) bannerEl.style.display = "none";
    if (now > S.tipUntil) tipEl.style.display = "none";
    if (mode !== "menu") drawRadar(now);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// =========================================================
//  START UP
// =========================================================
applyGraphics();
requestAnimationFrame(loop);
window.gameReady = true;
document.getElementById("lmsg").textContent = "LOADING PEOPLE";
// for testing in the browser console: window.__poop.state()
window.__poop = { state: () => S, mode: () => mode, joy, keys, cam, startGame, playerTile, isWall, bumps, distanceMap, PEDS, MODELS,
                  JUNCTIONS, lightFor, clock: () => trafficClock, setClock: t => { trafficClock = t; }, startEating, CHEEKS, FACE, setPlayerModel, addPolice,
                  setCapUp: v => { CAP_UP_COP = v; } };
Promise.all([loadModel("soldier"), loadModel("cop")]).then(() => {
  loadModel("swat");                                // SWAT only shows up later, so it loads in the background
  newGame();
  document.getElementById("loading").classList.add("hidden");
  showMain();
  loadModel("xbot").then(spawnPedestrians);       // people on the sidewalks load in the background
});
</script>
