<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const CFG = __CONFIG__;
const MAP = CFG.map;
const ROWS = MAP.length, COLS = MAP[0].length;
const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];

const inside = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const tile = (x, y) => (inside(x, y) ? MAP[y][x] : "#");
const WALKABLE = ".gspkd";
const isWall = (x, y) => !WALKABLE.includes(tile(x, y));   // squares people can't path through
const isRoad = (x, y) => tile(x, y) === ".";              // squares traffic drives on
const isB = (x, y) => inside(x, y) && MAP[y][x] === "#";

const H_ROADS = [], V_ROADS = [];
for (let y = 0; y < ROWS; y++) { let n = 0; for (let x = 0; x < COLS; x++) n += isRoad(x, y); if (n > COLS * 0.7) H_ROADS.push(y); }
for (let x = 0; x < COLS; x++) { let n = 0; for (let y = 0; y < ROWS; y++) n += isRoad(x, y); if (n > ROWS * 0.5) V_ROADS.push(x); }
const CROSSROADS = [];
for (const y of H_ROADS) for (const x of V_ROADS) if (isRoad(x, y)) CROSSROADS.push([x, y]);
// ---------- Junctions and traffic lights ----------
// a real crossroads has a street going through it both ways (the two lanes of an avenue don't count)
function isCross(x, y) {
  if (!isRoad(x, y)) return false;
  const L = isRoad(x - 1, y), R = isRoad(x + 1, y), U = isRoad(x, y - 1), D = isRoad(x, y + 1);
  const across = (L && R) || (L && isRoad(x - 2, y)) || (R && isRoad(x + 2, y));
  const along = (U && D) || (U && isRoad(x, y - 2)) || (D && isRoad(x, y + 2));
  return across && along;
}
const JUNC = Array.from({ length: ROWS }, () => Array(COLS).fill(null));   // which junction each square belongs to
const JUNCTIONS = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  if (!isCross(x, y) || JUNC[y][x]) continue;
  const J = { tiles: [], x0: x, x1: x, y0: y, y1: y, sides: [] };
  const todo = [[x, y]]; JUNC[y][x] = J;
  while (todo.length) {
    const [a, b] = todo.pop(); J.tiles.push([a, b]);
    J.x0 = Math.min(J.x0, a); J.x1 = Math.max(J.x1, a); J.y0 = Math.min(J.y0, b); J.y1 = Math.max(J.y1, b);
    for (const [dx, dy] of DIRS) { const nx = a + dx, ny = b + dy; if (isCross(nx, ny) && !JUNC[ny][nx]) { JUNC[ny][nx] = J; todo.push([nx, ny]); } }
  }
  // which sides have a road coming in (W, E, N, S)
  const anyRoad = list => list.some(([a, b]) => isRoad(a, b));
  const rows = [], cols = [];
  for (let yy = J.y0; yy <= J.y1; yy++) rows.push(yy);
  for (let xx = J.x0; xx <= J.x1; xx++) cols.push(xx);
  if (anyRoad(rows.map(yy => [J.x0 - 1, yy]))) J.sides.push([1, 0]);    // cars coming from the west drive east
  if (anyRoad(rows.map(yy => [J.x1 + 1, yy]))) J.sides.push([-1, 0]);
  if (anyRoad(cols.map(xx => [xx, J.y0 - 1]))) J.sides.push([0, 1]);
  if (anyRoad(cols.map(xx => [xx, J.y1 + 1]))) J.sides.push([0, -1]);
  J.lights = J.sides.length >= 3;   // a bend in the road doesn't need traffic lights

// 1) cut the "#" areas into rectangles; each gets a sidewalk on sides that face streets, parks, plaza etc.
const used = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
const RECTS = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  if (!isB(x, y) || used[y][x]) continue;
  let w = 1; while (isB(x + w, y) && !used[y][x + w]) w++;
  let h = 1; const rowFree = yy => { for (let i = 0; i < w; i++) if (!isB(x + i, yy) || used[yy][x + i]) return false; return true; };
  while (rowFree(y + h)) h++;
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) used[yy][xx] = true;
  const open = list => list.some(([xx, yy]) => inside(xx, yy) && !isB(xx, yy));
  const side = (n, f) => Array.from({ length: n }, (_, i) => f(i));

  const [iL, iR] = walk(open(side(h, i => [x - 1, y + i])), open(side(h, i => [x + w, y + i])), w);
  const [iT, iB] = walk(open(side(w, i => [x + i, y - 1])), open(side(w, i => [x + i, y + h])), h);

  if (p.w >= p.h) { const c = 1 + Math.floor(cityRand() * (p.w - 1)); split(r, { ...p, w: c }, big); split(r, { ...p, x: p.x + c, w: p.w - c }, big); }
  else { const c = 1 + Math.floor(cityRand() * (p.h - 1)); split(r, { ...p, h: c }, big); split(r, { ...p, y: p.y + c, h: p.h - c }, big); }

RECTS.forEach(r => split(r, { x: r.x, y: r.y, w: r.w, h: r.h }, r.w * r.h >= 30));

// 3) build each one. Height and look depend on the district.

  return false;
};

for (const R of RECTS) {
  const x0 = R.x - 0.5, x1 = R.x + R.w - 0.5, y0 = R.y - 0.5, y1 = R.y + R.h - 0.5;
  const south = (y0 + y1) / 2 > ROWS * 0.45;
  // each side: sidewalk width, point at (distance t along the side, distance d in from the road), lamp facing, length, facing into the block
  const sides = [[R.iT, (t, d) => [x0 + t, y0 + d], Math.PI / 2, R.w, 0], [R.iB, (t, d) => [x0 + t, y1 - d], -Math.PI / 2, R.w, Math.PI],
                 [R.iL, (t, d) => [x0 + d, y0 + t], Math.PI, R.h, Math.PI / 2], [R.iR, (t, d) => [x1 - d, y0 + t], 0, R.h, -Math.PI / 2]];
  for (const [ins, at, face, len, inward] of sides) {
    if (!ins) continue;
    // street lamps, with a palm tree or a hydrant / bin / newspaper box between them - all at the curb
    for (let t = 0.9; t < len - 0.3; t += 1.6) {
      const [lx, ly] = at(t, CURB);
      if (!nearObstacle(lx, ly, 0.45)) lamp(lx, ly, face);
      const t2 = t + 0.8;
      if (t2 > len - 0.5) continue;
      const [px, py] = at(t2, CURB);
      if (nearObstacle(px, py, 0.3)) continue;
      const r = cityRand();
      if (r < (south ? 0.6 : 0.28)) palm(px, py);
      else if (r < 0.72) hydrant(px, py);
      else if (r < 0.86) bin(px, py);
      else newsBox(px, py, inward);
    }
    if (ins < 0.4) continue;
    // a bus stop on some long streets, flower planters against the buildings on others
    let stop = -1;
    if (len >= 4 && cityRand() < 0.35) {
      stop = len / 2; busStop(at(stop, ins - 0.07), len, inward + Math.PI);
      for (const o of [-0.17, 0, 0.17]) { const [ox, oy] = at(stop + o, ins - 0.06); addObstacle(ox, oy, 0.06); }
    }
    for (let t = 0.7; t < len - 0.5; t += 1.3) {
      if (stop >= 0 && Math.abs(t - stop) < 0.5) continue;
      if (cityRand() < 0.3) { const [fx, fy] = at(t, ins - 0.05); planter(fx, fy, inward); }
    }
  }
}

{

const rightOf = (dx, dy) => [-dy, dx];                    // cars drive on the right
// traffic lights: a pole on the corner with an arm over the lane and a red / yellow / green signal facing the drivers
const signalBoxMat = new THREE.MeshStandardMaterial({ color: "#1d2024", roughness: 0.5, metalness: 0.4 });
const signalPlateMat = new THREE.MeshStandardMaterial({ color: "#e3b33b", roughness: 0.6 });
const LAMP_COLORS = ["#ff2a1a", "#ffb000", "#25ff6a"];
// one material per (light group, east-west / north-south, colour), so changing a light is just changing a material
const LAMP_MATS = [0, 1, 2].map(() => [0, 1].map(() => LAMP_COLORS.map(c => {
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(0.12) });   // "basic" = glows at full brightness
  m.userData.on = new THREE.Color(c).multiplyScalar(1.5); m.userData.off = m.color.clone(); m.userData.noShadow = true; return m;
})));
const LAMP_GEO = new THREE.CylinderGeometry(0.0155, 0.0155, 0.006, 16).rotateX(Math.PI / 2);
const VISOR_GEO = new THREE.CylinderGeometry(0.017, 0.017, 0.022, 14, 1, true, -Math.PI / 2, Math.PI).rotateX(Math.PI / 2).rotateZ(Math.PI);
for (const J of JUNCTIONS) {
  if (!J.lights) continue;
  for (const [dx, dy] of J.sides) {
    const [rx, ry] = rightOf(dx, dy);
    // the corner on the driver's right, just before the junction
    const cx = dx > 0 ? J.x0 - 0.5 : dx < 0 ? J.x1 + 0.5 : rx > 0 ? J.x1 + 0.5 : J.x0 - 0.5;
    const cy = dy > 0 ? J.y0 - 0.5 : dy < 0 ? J.y1 + 0.5 : ry > 0 ? J.y1 + 0.5 : J.y0 - 0.5;
    const px = cx - dx * 0.1 + rx * 0.1, py = cy - dy * 0.1 + ry * 0.1;
    if (isRoad(Math.round(px), Math.round(py))) continue;
    const face = Math.atan2(dx, dy), m = mat4(wx(px), 0, wz(py), face);   // local +z = driving direction, local -x = over the road
    const reach = 0.42;
    addGeo(new THREE.CylinderGeometry(0.009, 0.012, 0.6, 8).translate(0, 0.3, 0), darkMetal, m);
    addGeo(new THREE.CylinderGeometry(0.004, 0.005, reach, 6).rotateZ(Math.PI / 2).translate(reach / 2, 0.575, 0), darkMetal, m);
    // signal head hanging from the end of the arm, and a small one on the pole for people close by
    for (const [hx, hy, s] of [[reach - 0.02, 0.49, 1], [0, 0.33, 0.75]]) {
      const hm = m.clone().multiply(new THREE.Matrix4().makeTranslation(hx, hy, 0)).multiply(new THREE.Matrix4().makeScale(s, s, s));
      addGeo(new THREE.BoxGeometry(0.075, 0.155, 0.008).translate(0, 0, 0.012), signalPlateMat, hm);
      addGeo(new THREE.BoxGeometry(0.046, 0.128, 0.03), signalBoxMat, hm);
      for (let c = 0; c < 3; c++) {
        const ly = 0.04 - c * 0.04;
        addGeo(LAMP_GEO, LAMP_MATS[J.ctrl.group][dx !== 0 ? 0 : 1][c], hm.clone().multiply(new THREE.Matrix4().makeTranslation(0, ly, -0.016)));
        addGeo(VISOR_GEO, signalBoxMat, hm.clone().multiply(new THREE.Matrix4().makeTranslation(0, ly + 0.003, -0.026)));
      }
    }
    addObstacle(px, py, 0.02);
  }
}
const LIGHT_PROBES = [0, 1, 2].map(group => ({ lights: true, ctrl: { group } }));
let lightStates = "";
function updateLights() {
  let st = "";
  for (const P of LIGHT_PROBES) st += lightFor(P, 0) + lightFor(P, 1);
  if (st === lightStates) return;
  lightStates = st;
  LIGHT_PROBES.forEach((P, g) => [0, 1].forEach(axis => {
    const on = "ryg".indexOf(lightFor(P, axis));
    LAMP_MATS[g][axis].forEach((m, c) => m.color.copy(c === on ? m.userData.on : m.userData.off));
  }));
}

let S = null;
const rand = Math.random;
const PLAYER_R = 0.07;   // how "wide" a person is when bumping into things
const COP_HIT = 0.22;    // a police officer this close catches you

function characterIndex(eaten) { let idx = 0; CFG.characters.forEach((c, i) => { if (eaten >= c.needs) idx = i; }); return idx; }

// Does a person at (x, y) bump into a building, tree, lamp, water or the edge of the city?
function bumps(x, y, r = PLAYER_R, noProps = false) {
  if (x < -0.5 + r || y < -0.5 + r || x > COLS - 0.5 - r || y > ROWS - 0.5 - r) return true;
  const rx = Math.round(x), ry = Math.round(y);
  for (let ty = ry - 1; ty <= ry + 1; ty++) for (let tx = rx - 1; tx <= rx + 1; tx++) {
    if (!inside(tx, ty)) continue;
    const ch = MAP[ty][tx];
    if (ch === "w" || ch === "o") {
      const cx = Math.max(tx - 0.5, Math.min(x, tx + 0.5)), cy = Math.max(ty - 0.5, Math.min(y, ty + 0.5));
      if ((cx - x) ** 2 + (cy - y) ** 2 < r * r) return true;
    }
    for (const b of BUCKET[ty][tx]) {
      const cx = Math.max(b.x0, Math.min(x, b.x1)), cy = Math.max(b.y0, Math.min(y, b.y1));
      if ((cx - x) ** 2 + (cy - y) ** 2 < r * r) return true;
    }
    if (!noProps) for (const o of OBST[ty][tx]) if (Math.hypot(o.x - x, o.y - y) < r + o.r) return true;
  }

}

// Places poop can appear: streets, parks, plaza, beach and along the sidewalks
const SPOTS = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!isWall(x, y)) SPOTS.push([x, y]);
for (const R of RECTS) {
  const x0 = R.x - 0.5, x1 = R.x + R.w - 0.5, y0 = R.y - 0.5, y1 = R.y + R.h - 0.5;
  for (let t = 0.5; t < R.w; t += 1) { if (R.iT) SPOTS.push([x0 + t, y0 + R.iT / 2]); if (R.iB) SPOTS.push([x0 + t, y1 - R.iB / 2]); }
  for (let t = 0.5; t < R.h; t += 1) { if (R.iL) SPOTS.push([x0 + R.iL / 2, y0 + t]); if (R.iR) SPOTS.push([x1 - R.iR / 2, y0 + t]); }
}
for (let i = SPOTS.length - 1; i >= 0; i--) if (bumps(SPOTS[i][0], SPOTS[i][1], 0.1)) SPOTS.splice(i, 1);

// The walkable square someone is on, or (on a sidewalk) the nearest walkable square
function navTile(x, y) {
  const rx = Math.round(x), ry = Math.round(y);
  if (!isWall(rx, ry)) return [rx, ry];
  let bestT = [rx, ry], bestD = Infinity;
  for (let ty = ry - 1; ty <= ry + 1; ty++) for (let tx = rx - 1; tx <= rx + 1; tx++) {
    const d = Math.hypot(tx - x, ty - y);
    if (!isWall(tx, ty) && d < bestD) { bestD = d; bestT = [tx, ty]; }

  return bestT;
}

    if (kind === "cop" && MODELS.copf && rand() < 0.4) kind = "copf";     // some patrol officers are women
    const cop = { x, y, ang: 0, speedNow: 0, wp: null, kind, mesh: makeHuman(kind, "#1c2a50", 0.85), cap: kind === "swat" ? null : makeCap() };

// ---------- Input ----------
const keys = {};

function readMove() {
  const k = n => (keys[n] ? 1 : 0);
  let fwd = k("arrowup") + k("w") - k("arrowdown") - k("s");
  let side = k("arrowright") + k("d") - k("arrowleft") - k("a");
  let mag = Math.min(1, Math.hypot(fwd, side));
  let run = (SETTINGS.alwaysRun === "On") !== !!keys.shift;
  const jm = Math.hypot(joy.x, joy.y);
  if (jm > 0.15) { fwd = -joy.y; side = joy.x; mag = Math.min(1, jm); run = jm > 0.92; }
  return { fwd, side, mag, run };
}

// ---------- You: move the way the camera is looking ----------
function updatePlayer(now, dt) {
  const p = S.player, inp = readMove();
  p.moving = inp.mag > 0.1;
  let speed = 0;
  if (p.moving) {
    const fx = Math.sin(cam.yaw), fy = Math.cos(cam.yaw), rx = Math.sin(cam.yaw - Math.PI / 2), ry = Math.cos(cam.yaw - Math.PI / 2);
    let mx = fx * inp.fwd + rx * inp.side, my = fy * inp.fwd + ry * inp.side;

    speed = inp.run ? runSpeed() : WALK_SPEED * Math.max(0.4, inp.mag);
    const step = speed * dt;
    const inCar = (x, y) => S.cars.some(c => carBoxDist(c, x, y) < PLAYER_R);
    const free = (x, y) => !bumps(x, y) && (!inCar(x, y) || inCar(p.x, p.y));   // cars are solid (unless one already drove into you)
    if (free(p.x + mx * step, p.y)) p.x += mx * step;
    if (free(p.x, p.y + my * step)) p.y += my * step;
  }
  p.speedNow += (speed - p.speedNow) * Math.min(1, dt * 10);

}

// ---------- Police AI: it LEARNS how you move and PREDICTS where you're going ----------
// 1) Learning: every time you go through a junction, the police note whether you went straight, left, right or back.
//    Over time they learn your habits (and remember them in this browser between games).
// 2) Prediction: they follow the streets from where you are, the way you're heading, taking the turns you usually take.
// 3) Teamwork: one officer chases you directly, the others run to where they predict you'll be, to cut you off.
const BRAIN_KEY = "poopRunPoliceBrain";
const brain = (() => {
  let b = null;
  try { b = JSON.parse(localStorage.getItem(BRAIN_KEY)); } catch (e) { b = null; }
  if (!b || !b.turns) b = { turns: { straight: 1, left: 1, right: 1, back: 0.3 }, moves: 0 };
  return b;
})();
function saveBrain() { try { localStorage.setItem(BRAIN_KEY, JSON.stringify(brain)); } catch (e) { /* private mode: just don't save */ } }
const TURN_NAMES = { straight: "STRAIGHT ON", left: "LEFT", right: "RIGHT", back: "BACK" };
// which way did you turn? (dir = the way you were going, d = the way you went next)
function turnKind(dir, d) {
  if (d[0] === dir[0] && d[1] === dir[1]) return "straight";
  if (d[0] === -dir[0] && d[1] === -dir[1]) return "back";
  return dir[0] * d[1] - dir[1] * d[0] > 0 ? "right" : "left";
}

// Squares the police can run through: walkable, and nothing (tree, bench, fountain...) standing in the middle
let NAVOK = null;
function navOk(x, y) {
  if (!NAVOK) NAVOK = Array.from({ length: ROWS }, (_, yy) => Array.from({ length: COLS }, (_, xx) => !isWall(xx, yy) && !bumps(xx, yy, 0.09)));
  return inside(x, y) && NAVOK[y][x];
}
const exits = (x, y) => DIRS.filter(([dx, dy]) => navOk(x + dx, y + dy));

// watch the player and learn
function learnFromPlayer(dt) {
  const p = S.player, [tx, ty] = playerTile();
  const T = S.track || (S.track = { tile: [tx, ty], dir: null, vx: 0, vy: 0, lx: p.x, ly: p.y, saveT: 0 });
  const k = Math.min(1, dt * 5);
  T.vx += ((p.x - T.lx) / Math.max(dt, 1e-3) - T.vx) * k; T.vy += ((p.y - T.ly) / Math.max(dt, 1e-3) - T.vy) * k;
  T.lx = p.x; T.ly = p.y;
  if (tx !== T.tile[0] || ty !== T.tile[1]) {
    const ex = tx - T.tile[0], ey = ty - T.tile[1];
    const d = Math.abs(ex) >= Math.abs(ey) ? [Math.sign(ex), 0] : [0, Math.sign(ey)];
    // only junctions teach something (in a straight street there's no choice to make)
    if (T.dir && exits(T.tile[0], T.tile[1]).length >= 3) { brain.turns[turnKind(T.dir, d)] += 1; brain.moves++; }
    T.dir = d; T.tile = [tx, ty];
  }
  T.saveT += dt;
  if (T.saveT > 5) { T.saveT = 0; saveBrain(); }
}
// the way you're heading right now (from how you're actually moving)
function playerHeading() {
  const T = S.track;
  if (!T) return null;
  if (Math.hypot(T.vx, T.vy) < 0.12) return null;            // standing still
  return Math.abs(T.vx) >= Math.abs(T.vy) ? [Math.sign(T.vx), 0] : [0, Math.sign(T.vy)];
}
// follow the streets the way the player usually goes; returns the squares they'll probably reach
function predictPlayer(steps) {
  let [x, y] = playerTile(), dir = playerHeading();
  const path = [];
  if (!dir) return path;
  for (let i = 0; i < steps; i++) {
    let opts = exits(x, y).filter(d => !(d[0] === -dir[0] && d[1] === -dir[1]));
    if (!opts.length) opts = exits(x, y);
    if (!opts.length) break;
    const best = opts.reduce((a, b) => (brain.turns[turnKind(dir, b)] > brain.turns[turnKind(dir, a)] ? b : a));
    x += best[0]; y += best[1]; dir = best;

  }

}
// how many steps every square is from a target square (breadth-first search)
function distanceMap(target) {
  const [px, py] = target || playerTile();
  const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
  const queue = [[px, py]];
  dist[py][px] = 0;
  for (let qi = 0; qi < queue.length; qi++) {
    const [x, y] = queue[qi];
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (navOk(nx, ny) && dist[ny][nx] === Infinity) { dist[ny][nx] = dist[y][x] + 1; queue.push([nx, ny]); }

function navFor(target, now) {
  const key = target[0] + "," + target[1];
  let e = S.navCache.get(key);
  if (!e || now - e.t > 300) { e = { t: now, d: distanceMap(target) }; S.navCache.set(key, e); }
  return e.d;
}
// move one officer towards (tx, ty), walking round anything in the way
function stepCop(c, tx, ty, sp, dt) {
  let mx = tx - c.x, my = ty - c.y; const l = Math.hypot(mx, my);
  if (l < 0.01) { c.speedNow = 0; return; }
  mx /= l; my /= l;
  const step = Math.min(l, sp * dt), side = c.side || 1;
  for (const a of [0, 0.45, -0.45, 0.9, -0.9, 1.35, -1.35, 1.8, -1.8]) {
    const ang = a * side, ca = Math.cos(ang), sa = Math.sin(ang), dx = mx * ca - my * sa, dy = mx * sa + my * ca;

      if (ang < 0) c.side = -side;                       // keep going round the same side next time
      c.ang += angDiff(Math.atan2(dx, dy), c.ang) * Math.min(1, dt * 10);

}
let aiInfoT = 0;
function updateCops(now, dt) {
  const sp = copSpeed(), p = S.player, T = S.track;
  const chaseMap = navFor(playerTile(), now);
  const plan = predictPlayer(10);
  S.plan = plan;
  S.police.forEach((c, i) => {
    const dp = Math.hypot(p.x - c.x, p.y - c.y);
    let tx, ty;
    if (dp < 2.4 && clearLine(c.x, c.y, p.x, p.y)) {
      // close and can see you: run at where you'll be in a moment (not where you are now)
      const lead = Math.min(0.45, dp / sp * 0.6);
      tx = p.x + (T ? T.vx : 0) * lead; ty = p.y + (T ? T.vy : 0) * lead;
      if (bumps(tx, ty, 0.06)) { tx = p.x; ty = p.y; }
      c.wp = null; c.role = "chase";
    } else {
      // officer 1 chases, the others cut you off further and further ahead on your predicted route
      let goal = playerTile(), role = "chase";
      if (i > 0 && plan.length) {
        const ahead = Math.min(plan.length - 1, Math.max(1, Math.round(dp * 0.6) + (i - 1) * 2));
        goal = plan[ahead]; role = "cut off";
        if (Math.hypot(goal[0] - c.x, goal[1] - c.y) < 0.8) goal = playerTile();   // already there: go for the player
      }
      c.role = role;
      const map = role === "chase" ? chaseMap : navFor(goal, now);
      if (!c.wp || Math.hypot(c.wp[0] - c.x, c.wp[1] - c.y) < 0.12 || c.goalKey !== goal + "") {
        c.goalKey = goal + "";

        if (Math.hypot(cx - c.x, cy - c.y) > 0.16 && navOk(cx, cy)) c.wp = [cx, cy];
        else {
          const opts = DIRS.map(([dx, dy]) => [cx + dx, cy + dy]).filter(([x, y]) => navOk(x, y));
          if (opts.length) c.wp = opts.reduce((a, b) => (map[b[1]][b[0]] < map[a[1]][a[0]] ? b : a));
        }

    }
    const bx = c.x, by = c.y;
    c.squeeze = Math.max(0, (c.squeeze || 0) - dt);

    const far = Math.hypot(tx - c.x, ty - c.y) > 0.1;
    c.stuck = far && Math.hypot(c.x - bx, c.y - by) < sp * dt * 0.25 ? (c.stuck || 0) + dt : 0;
    if (c.stuck > 0.5) {

  // officers don't stand inside each other
  for (let i = 0; i < S.police.length; i++) for (let j = i + 1; j < S.police.length; j++) {
    const a = S.police[i], b = S.police[j], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d > 0.001 && d < 0.16) { const push = (0.16 - d) / 2, ux = (a.x - b.x) / d, uy = (a.y - b.y) / d;
      if (!bumps(a.x + ux * push, a.y + uy * push, 0.06)) { a.x += ux * push; a.y += uy * push; }
      if (!bumps(b.x - ux * push, b.y - uy * push, 0.06)) { b.x -= ux * push; b.y -= uy * push; } }
  }
  // show what the police have learned
  aiInfoT -= dt;
  if (aiInfoT <= 0) {
    aiInfoT = 0.5;
    const t = brain.turns, total = t.straight + t.left + t.right + t.back;
    const fav = Object.keys(t).reduce((a, b) => (t[b] > t[a] ? b : a));
    document.getElementById("aiinfo").innerHTML = "🚓 Police AI has studied <b>" + brain.moves + "</b> of your moves<br>" +
      "You usually go <b>" + TURN_NAMES[fav] + "</b> (" + Math.round(t[fav] / total * 100) + "%)" +
      (S.police.some(c => c.role === "cut off") ? " · cutting you off!" : "");
  }
}

// =========================================================
//  TRAFFIC AI: cars keep to their lane, stop at red lights, queue behind other cars
//  and brake for anyone standing in the road in front of them
// =========================================================
const CAR_HALF = 0.46, CAR_HALF_W = 0.19;
const CAR_ACCEL = 1.3, CAR_BRAKE = 3.2, CAR_BRAKE_MAX = 9;  // squares per second per second
const STOP_BACK = 0.8;          // how far before the junction a car's centre stops (front bumper at the white stop line)
const TURN_SPEED = 1.05;        // cars slow down to this to turn a corner
const LOOK_AHEAD = 3.0;         // how far ahead (squares) a driver watches for cars and people
// On a two-square-wide road, each square is one lane. A car on the left one is going the wrong way.
function wrongLane(x, y, dx, dy) { const [rx, ry] = rightOf(dx, dy); return isRoad(x + rx, y + ry) && !isRoad(x - rx, y - ry); }
function laneOffset(x, y, dx, dy) {
  const [rx, ry] = rightOf(dx, dy), R = isRoad(x + rx, y + ry), L = isRoad(x - rx, y - ry);
  return R !== L ? 0 : 0.23;     // avenue lane: drive in the middle of it. Narrow street: keep to the right half.
}
const laneOk = (x, y, dx, dy) => isRoad(x, y) && !wrongLane(x, y, dx, dy);
const dirOf = (a, b) => [b[0] - a[0], b[1] - a[1]];

// Plan a few squares ahead: mostly straight on, sometimes turn at a junction (never into the wrong lane)
function planRoute(car) {
  while (car.path.length < 8) {
    const n = car.path.length, B = car.path[n - 1], A = n > 1 ? car.path[n - 2] : car.back;
    const [dx, dy] = dirOf(A, B);
    const P = n > 2 ? car.path[n - 3] : (n > 1 ? car.back : null);
    const justTurned = P && (dirOf(P, A)[0] !== dx || dirOf(P, A)[1] !== dy);
    const opts = [];
    if (laneOk(B[0] + dx, B[1] + dy, dx, dy)) opts.push([dx, dy, 3]);
    const JB = isJ(B[0], B[1]) ? JUNC[B[1]][B[0]] : null;
    const linked = (x, y) => JB && JB.ctrl && isJ(x, y) && JUNC[y][x] !== JB && JUNC[y][x].ctrl === JB.ctrl;   // don't turn straight into a linked junction
    if (!justTurned) for (const [tx, ty] of [[dy, dx], [-dy, -dx]])
      if (laneOk(B[0] + tx, B[1] + ty, tx, ty) && laneOk(B[0] + 2 * tx, B[1] + 2 * ty, tx, ty) && !linked(B[0] + 2 * tx, B[1] + 2 * ty) && !linked(B[0] + 3 * tx, B[1] + 3 * ty))
        opts.push([tx, ty, opts.length ? 1.2 : 1]);
    if (!opts.length) for (const [tx, ty] of [[dx, dy], [dy, dx], [-dy, -dx]]) if (isRoad(B[0] + tx, B[1] + ty)) opts.push([tx, ty, 1]);
    if (!opts.length) opts.push([-dx, -dy, 1]);           // dead end: turn around
    let r = rand() * opts.reduce((s, o) => s + o[2], 0), c = opts[0];
    for (const o of opts) { r -= o[2]; if (r <= 0) { c = o; break; } }
    car.path.push([B[0] + c[0], B[1] + c[1]]);

// Where the car's centre will be after driving t more squares (corners are driven as smooth curves)
function carPoint(car, t) {
  let i = 0, f = car.s + t;

  const A = car.path[i], B = car.path[i + 1], Pr = i > 0 ? car.path[i - 1] : car.back, Nx = car.path[i + 2];
  const d0 = dirOf(A, B);
  let x, y, hx = d0[0], hy = d0[1];
  const curve = (C, da, db, u) => {       // quarter circle-ish curve through corner square C
    const E = [C[0] - da[0] * 0.5, C[1] - da[1] * 0.5], X = [C[0] + db[0] * 0.5, C[1] + db[1] * 0.5];
    x = (1 - u) * (1 - u) * E[0] + 2 * u * (1 - u) * C[0] + u * u * X[0];
    y = (1 - u) * (1 - u) * E[1] + 2 * u * (1 - u) * C[1] + u * u * X[1];
    hx = (1 - u) * (C[0] - E[0]) + u * (X[0] - C[0]); hy = (1 - u) * (C[1] - E[1]) + u * (X[1] - C[1]);

  const [rx, ry] = rightOf(hx, hy);

}

// distance from point (x, y) to car o's body
function carBoxDist(o, x, y) {
  const ex = x - o.px, ey = y - o.py, f = ex * o.hx + ey * o.hy, l = -ex * o.hy + ey * o.hx;
  return Math.hypot(Math.max(0, Math.abs(f) - CAR_HALF), Math.max(0, Math.abs(l) - CAR_HALF_W));

    const p = carPoint(car, t);
    let hit = false;
    if (!ghost) for (const o of S.cars) {
      if (o === car || o.hx * p.hx + o.hy * p.hy < -0.6) continue;     // oncoming traffic is in the other lane
      if (carBoxDist(o, p.x, p.y) < CAR_HALF_W) { limit(t - CAR_HALF - 0.62, "car", o); hit = true; break; }
    }
    if (hit) break;
    for (const h of people) if (Math.hypot(h.x - p.x, h.y - p.y) < 0.3) { limit(t - CAR_HALF - 0.22, h.player ? "player" : "person"); hit = true; break; }
    if (hit) break;
  }
  // 3) slow down for corners
  let target = gap <= 0 ? 0 : Math.min(vmax, Math.sqrt(2 * CAR_BRAKE * gap));
  for (let j = 1; j < car.path.length - 1; j++) {
    const a = dirOf(car.path[j - 1], car.path[j]), b = dirOf(car.path[j], car.path[j + 1]);
    if (a[0] !== b[0] || a[1] !== b[1]) { const d = Math.max(0, j - car.s - 0.5); target = Math.min(target, Math.sqrt(TURN_SPEED * TURN_SPEED + 2 * CAR_BRAKE * d)); break; }
    if (j - car.s > 2.5) break;
  }
  const before = car.v;
  car.v = target < car.v ? Math.max(target, car.v - CAR_BRAKE_MAX * dt) : Math.min(target, car.v + CAR_ACCEL * dt);
  car.braking = car.v < before - 0.01 || car.v < 0.05;
  car.why = car.v < 0.05 ? why : "";
  car.blocker = why === "car" ? blocker : null;
  // two cars waiting for each other (e.g. both turning in a junction)? after a moment one squeezes past
  let deadlock = false;
  for (let o = car.blocker, n = 0; o && n < 20; o = o.blocker, n++) if (o === car) { deadlock = true; break; }
  if (car.v < 0.05 && deadlock) { car.wait += dt; if (car.wait > 2 + rand() * 2) { car.ghostUntil = trafficClock + 1.6; car.wait = 0; } }
  else car.wait = 0;
  // move along the route
  car.s += car.v * dt;
  while (car.s >= 1) {
    car.s -= 1; car.back = car.path.shift(); planRoute(car);
    const [dx, dy] = dirOf(car.path[0], car.path[1]);
    if (!isJ(car.path[0][0], car.path[0][1])) car.kWant = laneOffset(car.path[0][0], car.path[0][1], dx, dy);
  }
  car.k += (car.kWant - car.k) * Math.min(1, dt * 3);
  const p = carPoint(car, 0);
  car.px = p.x; car.py = p.y; car.hx = p.hx; car.hy = p.hy;
}
// Put a new car on a random street square (not in a junction, not near (ax, ay))
function spawnCar(ax, ay, mesh) {
  for (let tries = 0; tries < 300; tries++) {
    const x = Math.floor(rand() * COLS), y = Math.floor(rand() * ROWS);
    if (!isRoad(x, y) || isJ(x, y) || Math.hypot(x - ax, y - ay) < 5) continue;
    const dirs = DIRS.filter(([dx, dy]) => laneOk(x, y, dx, dy) && isRoad(x + dx, y + dy) && !isJ(x + dx, y + dy));
    if (!dirs.length) continue;
    const [dx, dy] = pick(dirs, rand);
    if (S.cars.some(o => Math.hypot(o.px - x, o.py - y) < 1.6)) continue;
    const k = laneOffset(x, y, dx, dy);
    const car = { path: [[x, y], [x + dx, y + dy]], back: [x - dx, y - dy], s: 0, v: 0, vmax: (1000 / CFG.car_speed_ms) * (0.85 + rand() * 0.25),
                  k, kWant: k, px: x, py: y, hx: dx, hy: dy, wait: 0, ghostUntil: -1, goYellow: false, braking: false, why: "", mesh };
    planRoute(car);
    const p = carPoint(car, 0); car.px = p.x; car.py = p.y;
    return car;
  }
  return null;
}

// everyone the cars should brake for
function trafficPeople() {
  const L = S.police.map(c => ({ x: c.x, y: c.y }));

}
function updateTraffic(dt) {

function spawnPedestrians() {
  const loops = RECTS.filter(R => R.iL && R.iR && R.iT && R.iB);
  for (let i = 0; i < CFG.pedestrians && loops.length; i++) {

    if (rand() < 0.5) path.reverse();
    const ready = PEOPLE.filter(k => MODELS[k]);
    const kind = ready.length ? pick(ready, rand) : MODELS.xbot ? "xbot" : "soldier";
    const ped = { path, seg: Math.floor(rand() * 4), t: rand(), speed: 0.22 + rand() * 0.12, ang: 0,
                  mesh: makeHuman(kind, pick(PED_COLORS, rand), kind === "xbot" ? 0.85 : 0.6) };

function updatePeds(dt) {
  for (const p of PEDS) {
    const a = p.path[p.seg], b = p.path[(p.seg + 1) % 4], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    p.t += p.speed * dt / len;
    if (p.t >= 1) { p.t -= 1; p.seg = (p.seg + 1) % 4; }
    const A = p.path[p.seg], B = p.path[(p.seg + 1) % 4];
    const x = A[0] + (B[0] - A[0]) * p.t, y = A[1] + (B[1] - A[1]) * p.t;
    p.ang += angDiff(Math.atan2(B[0] - A[0], B[1] - A[1]), p.ang) * Math.min(1, dt * 6);
    p.mesh.position.set(wx(x), 0, wz(y));
    p.mesh.rotation.y = p.ang;

  }
}

const cam = { yaw: Math.PI, pitch: 0.26, dist: 1.25, curD: 1.25, lastInput: -1e9 };
const TARGET_H = HUMAN_H * 0.82;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function insideBuilding(x, y, h) {
  const tx = Math.round(x), ty = Math.round(y);
  if (!inside(tx, ty)) return false;
  return BUCKET[ty][tx].some(b => x > b.x0 - 0.04 && x < b.x1 + 0.04 && y > b.y0 - 0.04 && y < b.y1 + 0.04 && h < b.h + 0.1);
}
function updateGameCamera(now, dt) {
  const p = S.player;
  if (p.moving && now - cam.lastInput > 2500) cam.yaw += angDiff(p.ang, cam.yaw) * Math.min(1, dt * 0.8);
  const bx = -Math.sin(cam.yaw), by = -Math.cos(cam.yaw), tanp = Math.tan(cam.pitch);
  const hd = cam.dist * Math.cos(cam.pitch);
  let lim = hd;
  for (let s = 0.08; s <= hd; s += 0.03) {
    if (insideBuilding(p.x + bx * s, p.y + by * s, TARGET_H + tanp * s)) { lim = Math.max(0.15, s - 0.08); break; }
  }
  cam.curD = lim < cam.curD ? lim : cam.curD + (lim - cam.curD) * Math.min(1, dt * 3);
  const d = cam.curD;
  camPos.set(wx(p.x + bx * d), Math.max(0.05, TARGET_H + tanp * d), wz(p.y + by * d));
  camLook.set(wx(p.x), TARGET_H, wz(p.y));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  aimSun(camLook.x, camLook.z);
}

}

const SENS = { Low: 0.0035, Medium: 0.006, High: 0.0095 };
let dragId = null, lastX = 0, lastY = 0;
stage.addEventListener("contextmenu", e => e.preventDefault());
stage.addEventListener("pointerdown", e => {
  if (mode !== "play" && mode !== "dying" && !inBoss()) return;
  if (e.pointerType === "mouse" && e.button === 0 && inBoss() && !(e.target.closest && e.target.closest("button"))) { firing = true; e.preventDefault(); return; }
  if (e.pointerType === "mouse" && e.button !== 2) return;   // right mouse button turns the camera
  if (e.target.closest && e.target.closest("button, #joy")) return;
  dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;

  cam.pitch += (e.clientY - lastY) * s * (SETTINGS.invertY === "On" ? -1 : 1);
  cam.pitch = Math.max(-0.1, Math.min(1.3, cam.pitch));
  lastX = e.clientX; lastY = e.clientY;

});

const compassEl = document.getElementById("compass"), cctx = compassEl.getContext("2d");
function drawCompass(targets) {
  compassEl.classList.toggle("on", targets.length > 0);
  if (!targets.length) return;
  const W = compassEl.width, H = compassEl.height, HALF = 1.25, px = W / 2 / HALF, p = S.player;
  const xOf = b => W / 2 - angDiff(b, cam.yaw) * px;          // bearing -> x on the bar (right side = to your right)
  cctx.clearRect(0, 0, W, H);
  cctx.fillStyle = "rgba(0,0,0,.55)"; cctx.beginPath(); cctx.roundRect(0, 0, W, H, 10); cctx.fill();
  cctx.textAlign = "center"; cctx.textBaseline = "middle";

  for (let deg = 0; deg < 360; deg += 15) {
    const b = deg * Math.PI / 180, rel = angDiff(b, cam.yaw);
    if (Math.abs(rel) > HALF) continue;
    const x = xOf(b);
    if (NAMES[deg]) { cctx.fillStyle = "#fff"; cctx.font = "bold 16px Oswald, sans-serif"; cctx.fillText(NAMES[deg], x, H / 2); }
    else { cctx.fillStyle = "rgba(255,255,255,.45)"; cctx.fillRect(x - 1, deg % 45 ? H * 0.62 : H * 0.5, 2, H * 0.3); }
  }
  for (const t of targets) {
    const b = Math.atan2(t.x - p.x, t.y - p.y), rel = angDiff(b, cam.yaw), edge = Math.abs(rel) > HALF * 0.94;
    const x = edge ? (rel > 0 ? 18 : W - 18) : xOf(b);
    cctx.fillStyle = t.color; cctx.beginPath(); cctx.arc(x, 15, 11, 0, Math.PI * 2); cctx.fill();
    cctx.fillStyle = "#2a1800"; cctx.font = "bold 15px Impact, Arial Black, sans-serif"; cctx.fillText(t.icon, x, 16);
    cctx.fillStyle = "#fff"; cctx.font = "bold 11px Oswald, sans-serif";
    cctx.fillText((edge ? (rel > 0 ? "◀ " : "") : "") + Math.round(Math.hypot(t.x - p.x, t.y - p.y) * 5) + "m" + (edge && rel < 0 ? " ▶" : ""), x, H - 7);

}

  }
  renderer.render(scene, camera);
  updatePreview(dt);
  requestAnimationFrame(loop);
}

// =========================================================
//  START UP
// =========================================================
applyGraphics();
requestAnimationFrame(loop);
window.gameReady = true;
document.getElementById("lmsg").textContent = "LOADING PEOPLE";
// for testing in the browser console: window.__poop.state()
window.__poop = { state: () => S, mode: () => mode, joy, keys, cam, startGame, playerTile, isWall, bumps, distanceMap, PEDS, MODELS,
                  JUNCTIONS, lightFor, brain, predictPlayer, clock: () => trafficClock, setClock: t => { trafficClock = t; }, startEating, CHEEKS, FACE, FACE_REAL, setPlayerModel, addPolice,
                  setCapUp: v => { CAP_UP_COP = v; }, startQuest, startBoss, BOSS, ARENA, shoot: () => shoot(performance.now()), setFiring: v => { firing = v; }, openCheat, runCheat, cheatTap: () => cheatTap(performance.now()), clipBufs, getClip, music: () => musicNode, voice: () => voiceNode, city: () => cityNode, SKINS, ensureModel, wearSkin, buySkin, bank: () => bank, setBank: v => { bank = v; store.set("bank", v); }, M, renderMenu, openPanel };
// you and the police load first (the old armour model is only a backup if they can't download)
Promise.all([loadModel("hero").then(g => g || loadModel("soldier")), loadModel("cop").then(g => g || loadModel("soldier"))]).then(() => {
  loadModel("swat"); loadModel("copf");             // these show up a bit later, so they load in the background
  newGame();
  document.getElementById("loading").classList.add("hidden");
  showMain();
  Promise.all(PEOPLE.map(loadModel)).then(r => (r.some(Boolean) ? spawnPedestrians() : loadModel("xbot").then(spawnPedestrians)));   // people on the sidewalks load in the background
});
</script>
